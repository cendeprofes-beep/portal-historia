  body {

    gap: var(--gap);
    width: 100%;
  }
  .tarjeta {
    display: block;
    width: min(100%, 720px);
    aspect-ratio: 1122 / 1402;
    border-radius: 22px;
    overflow: hidden;
    border: 3px solid rgba(255,255,255,.85);
    box-shadow: 0 10px 30px rgba(255,255,255,.08);
    transition: transform .2s ease, box-shadow .2s ease, filter .2s ease;

  }
  .tarjeta img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .tarjeta:hover { transform: translateY(-4px); filter: brightness(1.05); box-shadow: 0 14px 40px rgba(255,255,255,.2); }
  .pie {
    flex: 0 0 auto; width: 100%; min-height: var(--foot);
    display: flex; align-items: center; justify-content: center;
    padding: 4px 8px 2px; text-align: center;
    font-family: Georgia, "Times New Roman", serif; font-weight: 700;
    font-size: clamp(0.42rem, 1.04vw, 0.6rem); line-height: 1.35; color: #f2c14e;
  }
  .nav {
    position: fixed; top: max(12px, env(safe-area-inset-top)); z-index: 10;
    width: 56px; height: 56px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: #111; border: 2px solid rgba(255,255,255,.85);
    transition: background .2s ease, transform .2s ease;
  }
  .nav:hover, .nav:focus-visible { background: #333; transform: scale(1.08); outline: none; }
  .nav svg { width: 30px; height: 30px; stroke: #fff; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  .nav-izq { left: max(12px, env(safe-area-inset-left)); }
  .nav-der { right: max(12px, env(safe-area-inset-right)); }
  @media (min-width: 900px) and (orientation: landscape) {
    .tarjetas { flex-direction: row; justify-content: center; align-items: center; }
    .tarjeta {
      width: min(
        calc((100vw - 2 * var(--pad) - 2 * var(--gap)) / 3),
        calc((100vh - 2 * var(--pad) - var(--bar) - var(--foot)) * 1122 / 1402)
      );
      width: min(
        calc((100vw - 2 * var(--pad) - 2 * var(--gap)) / 3),
        calc((100dvh - 2 * var(--pad) - var(--bar) - var(--foot)) * 1122 / 1402)

  }
