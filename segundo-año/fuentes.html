    "texto": "Nicolás Copérnico (1473-1543)\nFragmento del \"De Revolutionibus orbium coelestium, 1543\".\n«Algunos piensan que la tierra permanece quieta, en cambio Filolao el Pitagórico dice que se mueve en un círculo oblicuo alrededor del fuego, de la misma manera que el Sol y la Luna. Heráclides el del Ponto y Ecfanto el Pitagórico piensan que la tierra se mueve, pero no con traslación, sino como una rueda, alrededor de su propio centro, desde el amanecer al atardecer». En consecuencia, aprovechando esa ocasión empecé yo también a pensar sobre la movilidad de la tierra. Y aunque la opinión parecía absurda, sin embargo, puesto que sabía que a otros se les había concedido tal libertad antes que a mí, de modo que representaban algunos círculos para demostrar los fenómenos de los astros, estimé que fácilmente se me permitía experimentar, si, supuesto algún movimiento de la tierra, podrían encontrarse en la revolución de las órbitas celestes demostraciones más firmes que lo eran las de aquellos.\n£\nAlexander Ross (1590–1654)\nFragmento de \"The new planet no planet (1646)\" [El nuevo planeta no es un planeta]\n(Capítulo II, respuesta al argumento de la antigüedad)\n\"Somos de la opinión de todos los hombres, de todos los tiempos y de todas las naciones. Vos os esclaváis a un solo hombre. Nosotros no condenamos vuestra opinión porque sea nueva, sino porque no es verdadera. Una nueva falsedad, una novedad falsa, y tal nuevo engendro deforme debe ser ahogado en la infancia: Principiis obsta — sofoca el huevo del basilisco antes de que nazca. Decís que es tan sólo una novedad en Filosofía, pero yo digo que ataca a la Divinidad: porque la Divinidad nos enseña que la detención del Sol y el movimiento de la Tierra son obras milagrosas del poder sobrenatural de Dios; vuestra nueva Filosofía nos dice que son las obras ordinarias de la Naturaleza.\"\n(Capítulo VI, sobre la Tierra como centro del mundo)\n\"El sabio Dios colocó la Tierra en medio de este gran sistema del mundo, no sólo por causa del hombre, quien siendo el Señor del universo y el más honorable de todas las criaturas, merecía tener el lugar más honorable, que es el medio: sino principalmente para que el hombre, con todas las demás criaturas animales y vegetales, pudiera, por igual distancia de todas las partes del cielo, recibir igual confort e influencia. Imaginad que hubiera dos tierras: una en el centro, y otra fuera del centro; las influencias y poderes del cielo deben concurrir y unirse más igualmente en ésta que en aquélla.\"\n£\nGalileo Galilei (1564-1642)\nFragmentos de \"Carta a Cristina de Lorena (1615)\"\n\nFragmento 1: \"…viniendo a saber lo que pienso en mis estudios astronómicos y de filosofía acerca de la disposición de las partes del mundo, a saber, que el Sol, sin cambio de lugar, está situado en el centro de las conversiones de los globos celestes y que la Tierra, girando sobre sí misma, se le mueve en torno.\"\n\nFragmento 2: \"Estimo que las disputas sobre problemas naturales no se deberían iniciar poniendo por garantía éste o aquel pasaje Escritural, sino manifiestas experiencias y demostraciones necesarias; puesto que, dimanando del Verbo Divino tanto la Escritura Sacra como la naturaleza, ésa, cual dictado del Espíritu Santo y ésta, cual observantísima ejecutora de los mandatos de Dios; y siendo la naturaleza, por el contrario, inexorable e inmutable y no trascendiendo jamás los términos de las leyes impuéstasle ni cuidando en absoluto si sus complejas razones y modos de operar son o no son manifiestos a la capacidad de los hombres.\"\n\nFragmento 3: \"La astronomía, de la cual hay tan pequeñísima parte que ni siquiera se nombran allí [en la Biblia] los planetas, salvo el Sol y la Luna, y una o dos veces solamente, Venus, bajo el nombre de Lucifer. Si, en cambio, los escritores sacros hubiesen tenido el designio de inculcar al pueblo distribución y movimiento de los cuerpos celestes y, en consecuencia, tuviésemos hoy que instruirnos de esas cosas a través de las Sagradas Escrituras, no habrían sido —a mi parecer— tan parcos en lo que dijeron, que es como decir nada en comparación a las infinitas conclusiones admirables que en aquella ciencia se contienen y se demuestran.\"\n£\nLuis Miguel Carolino [Doctor en Historia y Profesor Asociado (con \"Agregação\") en el Instituto Universitario de Lisboa (ISCTE-IUL), Portugal] Fragmento de su obra \"Geo-heliocentric controversies: The Jesuits, Tycho Brahe, and the confessionalisation of science in seventeenth-century Lisbon.\" Edizioni Ca' Foscari – Venice University Press, 2023.\nLos matemáticos jesuitas activos en Lisboa adoptaron el modelo geoheliocéntrico propuesto por Tycho Brahe poco después de que las autoridades de la Compañía de Jesús lo aceptaran en Roma. A comienzos de la década de 1620, Johann Chrysostomus Gall incluyó una descripción del sistema ticónico en sus apuntes de clase, afirmando que la Tierra permanece inmóvil en el centro del universo, alrededor de la cual se mueven el Sol, la Luna y las estrellas fijas, mientras que los planetas giran alrededor del Sol. Kenneth J. Howell ha sostenido que concebir el sistema ticónico como un compromiso entre «un antiguo Ptolomeo y un moderno Copérnico» no da cuenta de la propia visión de Tycho Brahe. Lo mismo puede afirmarse respecto de los muy pocos jesuitas que se inclinaron por el sistema ticónico antes de la condena del heliocentrismo en 1616 y de la aceptación oficial de Tycho Brahe por parte de las autoridades jesuitas en 1620."

    "titulo": "Centralización monárquica y el surgimiento del Estado-Nación",
    "texto": "Jean Bodin (1530-1596)\nFragmentos de \"Los seis libros de la República, 1576\".\nFragmento 1: Si pasamos de lo pequeño a lo grande, se puede decir que la república debe contar con varias cosas: territorio suficiente para albergar a sus habitantes; una tierra fértil y ganado abundante para alimento y vestido de los súbditos; dulzura del cielo, templanza del aire y bondad de las aguas para que gocen de salud, y, para la defensa y refugio del pueblo, materias propias para construir casas y fortalezas, si el lugar no es de suyo cubierto y defendible. Estas son las primeras cosas a las que se presta mayor atención en toda república. Se buscan después las comodidades, como son las medicinas, los metales, los tintes. Para dominar a los enemigos y extender sus fronteras por conquista, se hace provisión de armas ofensivas. En fin, dado que los apetitos de los hombres son casi siempre insaciables, se quiere tener abundancia, no sólo de las cosas útiles y necesarias, sino también de las placenteras e inútiles. [...]\n\nFragmento 2: La segunda parte de la definición de república que hemos establecido hace referencia a la familia, que constituye la verdadera fuente y origen de toda república, así como su principal elemento. Jenofonte y Aristóteles han separado, sin razón, a mi juicio, la economía doméstica de la política, lo que no puede hacerse sin desmembrar la parte principal del todo; es tanto como construir una ciudad sin casas y, por la misma razón, sería preciso una ciencia especial de las corporaciones y colegios, que no son ni ciudades ni familias pero que, sin embargo, constituyen parte de la república. Al igual que la familia bien dirigida es la verdadera imagen de la república, y el poder doméstico es comparable al poder soberano, así, el recto gobierno de la casa es el verdadero modelo del gobierno de la república. Del mismo modo que el cuerpo goza de salud si cada miembro en particular cumple con su función, la república marchará bien si las familias están bien gobernadas.\n\nFragmento 3: Toda república, toda corporación, todo colegio y toda familia se gobierna por mando y obediencia, una vez que la libertad natural que corresponde a cada uno para vivir a su arbitrio es puesta bajo el poder de otro. Todo poder de mando sobre otro, es público o privado. El poder público reside en el soberano que da la ley, o en las personas de los magistrados que se pliegan a la ley y mandan a los demás magistrados y a los particulares. El mando privado corresponde a los cabezas de familia y a las corporaciones y colegios en general, sobre cada uno de ellos en particular, y a la parte menor de toda la corporación en nombre colectivo.\n£\nCharles Tilly (1929-2008) [Prestigioso sociólogo, politólogo e historiador estadounidense]\nFragmentos de \"Coerción, capital y los Estados europeos, 990-1990\"\nDe cómo los Estados controlaron la coerción\nLos Estados europeos han sido los primeros [en construir] temibles medios coercitivos propios y privando a la población civil de acceso a estos medios. En su mayoría, los Estados recurrieron fuertemente al capital y los capitalistas cuando reorganizaron la coerción, Pero los diversos Estados lo hicieron en modos llamativamente diferentes. No se debe subestimar la dificultad e importancia del cambio. Durante la mayor parte de la historia europea, el hombre común (una vez más, importa la forma masculina de la palabra) ha dispuesto por lo general de armas mortales; dentro de cualquier Estado dado, además, los poderosos locales y regionales han tenido casi siempre el control sobre unos medios concentrados de fuerza que, unidos, podían igualar y aún superar a los del Estado. Durante mucho tiempo, los nobles de muchos lugares de Europa tenían el derecho legal a librar guerras particulares; los Usatges catalanes del siglo XII registraban específicamente dicho derecho. Los bandidos (muchas veces secciones licenciadas de ejércitos privados o públicos) florecieron en gran parte de Europa hasta el siglo XVII. [...] Ha habido gentes exteriores al Estado que se han beneficiado ampliamente de su propiedad privada de medios violentos. Desde el siglo XVII, no obstante, los gobernantes han logrado inclinar la balanza de modo decisivo tanto frente a los ciudadanos particulares como frente a los poderosos que rivalizaban con ellos dentro de sus Estados. Han logrado que el recurso a las armas sea delictivo, impopular y poco práctico para la mayoría de sus ciudadanos, han proscrito los ejércitos privados y han hecho que nos parezca normal que los agentes armados del Estado se enfrenten a la población civil desarmada. Al haberse aferrado a la posesión privada de armas de fuego, Estados Unidos se aparta de los restantes países occidentales y paga el precio en tasas de muertes por armas de fuego cientos de veces superiores a las de sus compañeros europeos; en la proliferación de armas privadas, Estados Unidos se asemeja más al Líbano o Afganistán que a Gran Bretaña u Holanda. El desarme de la población civil se produjo a lo largo de una serie de pequeños pasos: la incautación general de armas al final de las rebeliones, la prohibición del duelo, los controles sobre la producción de armas, la introducción de licencias para las armas privadas, las restricciones sobre el despliegue público de fuerza armada.[...] Luis XIII, el monarca del siglo XVII que, con ayuda de Richelieu y Mazarino, reconstruyó la fuerza armada del Estado francés, probablemente demolió más fortalezas de las que construyó. Pero las levantó en las fronteras y las destruyó en el interior. Para someter a los magnates y a las ciudades que se resistían a su gobierno, lo habitual fue que desmantelara sus fortificaciones, redujera sus derechos a portar armas y con ello disminuyera las posibilidades de toda futura rebelión seria.\n£\nPerry Anderson (1938-   ) [Historiador y ensayista político inglés, especialista en historia intelectual]\nFragmento de \"El Estado Absolutista\" [primera edición, 1974]\nLa larga crisis de la economía y la sociedad europeas durante los siglos XIV y XV puso de manifiesto las dificultades y los límites del modo de producción feudal en el postrer período medieval. ¿Cuál fue el resultado político final de las convulsiones continentales de esta época? En el transcurso del siglo XVI apareció en Occidente el Estado absolutista. Las monarquías centralizadas de Francia, Inglaterra y España representaron una ruptura decisiva con la soberanía piramidal y fragmentadas de las formaciones sociales medievales, con sus sistemas de feudos y estamentos.[...] Las monarquías absolutas introdujeron unos ejércitos y una burocracia permanentes, un sistema nacional de impuestos, un derecho codificado y los comienzos de un mercado unificado.[A lo largo de los siglos XIV-XV] el poder de clase de los señores feudales quedó, pues, directamente amenazado por la desaparición gradual de la servidumbre [dado que los campesinos ya no pagaban renta al señor en trabajo, sino en dinero]. El resultado fue un desplazamiento de la coerción política en un sentido ascendente hacia una cima centralizada y militarizada: el Estado absolutista. La coerción diluida en el plano de la aldea, se concentró en el plano \"nacional\". El resultado de este proceso fue un aparato reforzado de poder real, cuya función política permanente era la represión de las masas campesinas y plebeyas en la base de la jerarquía social."

    "titulo": "El mosaico itálico: riqueza comercial y soberanía papal",
    "texto": "Lorenzo Valla (1407-1457)\nFragmentos de \"Sobre la falsa donación de Constantino, 1440\"\nFragmento 1: \"Sé que hace ya un tiempo que los oídos de los hombres están esperando a oír de qué crimen acuso a los pontífices romanos. Es, de hecho, algo enorme, o de una ignorancia supina, o de una avaricia inmensa, como es la esclavitud de los ídolos, o de un gran deseo de poder, cuya compañera siempre es la crueldad. Pues ya por unos cuantos siglos, o bien no han entendido que la donación de Constantino era falsa e inventada, o bien ellos mismos la inventaron; o bien sus sucesores, siguiendo las huellas del engaño de sus antepasados, la defendieron como verdadera aun sabiendo que era falsa, ofendiendo así la majestad del pontificado, ofendiendo el recuerdo de los antiguos pontífices, ofendiendo la religión cristiana y mezclándolo todo con crímenes, ruinas y desastres.\"\n\nFragmento2: \"Dicen que la ciudad de Roma es suya, que suyo es el reino de Sicilia y Nápoles, que suya es toda Italia, la Galia, Hispania, Germania y Britania; en definitiva, que es suyo todo Occidente. Y resulta que todo esto está contenido en el mismo documento de la donación. ¿Así que, sumo pontífice, todo esto es tuyo? ¿Tienes la intención de recuperarlo todo? ¿Tu plan es arrancarles sus ciudades a todos los reyes y gobernantes de Occidente, u obligarles a pagarte un tributo anual? Pues yo, bien al contrario, pienso que con más justicia le es lícito a los gobernantes arrancarte a ti el imperio que posees.\"\n£\nNicolás Maquiavelo (1469-1527)\nFragmento de \"Discursos sobre la primera década de Tito Livio, 1517\".\nEn nuestros tiempos hemos visto las novedades ocurridas en la república de Florencia por no poder demostrar legalmente la opinión publica su animosidad contra un ciudadano; así sucedió en la época de Francisco Valori, que era como príncipe de la ciudad. Juzgáronle muchos sobrado ambicioso y hombre capaz, por su audacia y alientos, de sobreponerse a los demás ciudadanos. No había medio en la república de resistirle sino con un bando contrarió al suyo. Valori no temía que esto sucediera, pero sí que apelaran contra él a procedimientos extraordinarios, por lo cual comenzó a proporcionarse partidarios que lo defendiesen. Por su parte, los que le combatían, careciendo de medios legales para vencerlo, acudieron a los ilegítimos, y unos y otros pusieron mano a las armas. Si hubiera habido medio legal de privarle del poder, acabara su autoridad sin más daño que el suyo propio; pero siendo preciso emplear los recursos ilegítimos, su caída fue en perjuicio suyo y de otros muchos nobles\nciudadanos.\n£\nPerry Anderson (1938-   ) [Historiador y ensayista político inglés, especialista en historia intelectual]\nFragmento de \"El Estado Absolutista\" [primera edición, 1974]\nEl estado absolutista surgió en la era del Renacimiento. Italia preparó el terreno para muchas de sus técnicas administrativas y diplomáticas. De ahí que sea preciso preguntar: ¿por qué no alcanzó nunca la propia Italia un absolutismo nacional? [...] El determinante fundamental del fracaso en producir un absolutismo nacional [radica] en el desarrollo prematuro del capital mercantil en las ciudades del norte de Italia, que impidió la aparición de un poderoso Estado feudal reorganizado en el plano nacional. La riqueza y vitalidad de las comunas lombardas y toscanas derrotó el más serio esfuerzo por establecer una monarquía feudal unificada que podría haber echado las bases de un absolutismo posterior, esto es, la tentativa de Federico II en el siglo XIII por extender, desde su base en el sur [en el reino de Sicilia] su Estado señorial relativamente avanzado.\n£\nEnciclopedia Britannica, artículo sobre Francesco Ferruccio (1489-1530)\nFrancesco Ferruccio (nacido el 14 de agosto de 1489 en Florencia [Italia]—fallecido el 3 de agosto de 1530 en Gavinana, cerca de Pistoia, República de Florencia) fue un líder militar florentino que defendió su ciudad natal en los últimos días de la República de Florencia. Florencia se opuso al papa Clemente VII y al emperador del Sacro Imperio Romano Germánico Carlos V, quienes buscaban restaurar a la depuesta familia Medici. Una estatua de este héroe popular aún se alza en Florencia. Ferruccio, primero comerciante y luego funcionario municipal, recibió su formación militar en 1527 en las Bandas Negras (Bande Nere), una milicia mercenaria. Capitán de gran capacidad, fue nombrado comisario militar en Empoli y organizó emboscadas para hostigar a las tropas imperiales que avanzaban hacia la cercana Florencia. Sin embargo, mientras sofocaba una revuelta en Volterra (27 de abril de 1530), Empoli cayó en manos del enemigo, y una enfermedad lo inmovilizó en Pisa. Cuando finalmente intentó socorrer a la asediada Florencia, sufrió una derrota en Gavinana (3 de agosto de 1530). Herido, fue capturado y asesinado por el comandante enemigo Fabrizio Maramaldo. Florencia cayó diez días después."

    "num": 14,
    "titulo": "Apogeo y ocaso de la hegemonía imperial de los Habsburgo",
    "texto": "Joseph Pérez (1931-2020) [historiador español especialista en la España de la Modernidad temprana]\nFragmentos del libro \"Los comuneros\", publicado por Cuadernos Historia 16 (Madrid, 1996)\n\nFragmento 1: El movimiento comunero —la primera de las guerras civiles que en los tiempos modernos ensangrentó los campos de España [...]— tiene causas y características que permiten definirlo como preferentemente —aunque no exclusivamente— urbano y castellano. Las causas hay que buscarlas en las dificultades que conoce Castilla desde principios del siglo XVI y en los cambios políticos que supone el advenimiento de los Austrias. El siglo XVI empieza con una serie de malas cosechas, hambres y epidemias. Los precios suben rápidamente, bajan entre 1510 y 1515 [...] y vuelven a subir tremendamente hasta alcanzar su punto máximo en 1521. Ante la crisis se rompe el equilibrio que los Reyes Católicos habían logrado mantener entre las regiones del reino. El norte (Burgos, la Montaña) y Andalucía resisten más porque el comercio internacional permite mantener ciertas actividades, pero empiezan a expresarse quejas contra los monopolios (el de los burgaleses y extranjeros, sobre todo genoveses).[...] La situación política, caracterizada por una serie de problemas dinásticos desde la muerte de Isabel la Católica en 1504 (incapacidad de doña Juana la Loca, heredera del trono; reinado efímero de su marido, Felipe el Hermoso; regencias de Fernando el Católico y del cardenal Cisneros) impide que los gobernantes presten a tales dificultades la debida atención.\n\nFragmento 2: En 1516, don Carlos, nieto de los Reyes Católicos, se proclama rey de Castilla contra el parecer de Cisneros y del Consejo Real (ya que no puede ser rey en vida de su madre, doña Juana, a quien las Cortes no han querido privar de sus derechos) y en octubre de 1517 llega a la Península para hacerse cargo efectivo del gobierno. El nuevo soberano causa mala impresión: no habla castellano; viene rodeado de una corte de consejeros flamencos (entre ellos, el famoso señor de Chievres, que goza de la confianza del rey) que se reparten los oficios y beneficios sin el menor escrúpulo: el caso más escandaloso fue el nombramiento del sobrino de Chievres, un muchacho de veintiún años, como sucesor de Cisneros en el arzobispado de Toledo. Económicamente, la parte central, en torno a Toledo y Valladolid, parece mucho más afectada: los talleres y comercios de Zamora, Segovia, Toledo y Cuenca conocen una marcada decadencia. Pero hay más: en 1519, don Carlos es elegido emperador y decide marchar cuanto antes a Alemania. El hecho cristaliza en el descontento que cunde en Castilla. El regimiento de Toledo toma entonces la iniciativa de una campaña nacional, primero contra los impuestos que la Corte pretende subir para sufragar los gastos de la coronación imperial y luego contra la misma política imperial. La campaña alcanza mayor relieve a principios de 1520 con motivo del llamamiento a Cortes. De los conventos de Salamanca sale, en febrero, un documento enviado a todas las ciudades con voz y voto en Cortes y que resume las reivindicaciones de Castilla: contra los impuestos (el servicio) que el rey quiere exigir antes de su partida; contra el Imperio: Castilla no tiene por qué sacrificarse al Imperio ni quiere estar sometida a él. Y los frailes de Salamanca concluyen con una amenaza velada: si el rey se niega a atender las justas quejas de su pueblo, las Comunidades tendrían que tomar la defensa del reino.\n£\nCarlos V de Alemania y I de España (1500-1558)\nFragmentos del \"Discurso de abdicación de Carlos V en Bruselas (1555)\"\nHace treinta y seis años sucedió, teniendo yo diecinueve años, la muerte de mi abuelo, el Emperador Maximiliano, tras lo cual, aunque era muy mozo, me dieron la dignidad imperial en su lugar. No pretendí ser emperador por ambición de gobernar muchos reinos, sino por mirar por el bien y común salud de Alemania, mi patria muy amada, y del resto de mis reinos, particularmente el de Flandes; por conseguir la paz y concordia de la Cristiandad; y para poner todas mis fuerzas y las de mis reinos en la defensa de la religión cristiana contra el Turco. Mas si bien fue este mi celo, no pude ejecutarlo como quisiera, por el estorbo y embarazo que me han causado las herejías de Lutero y de los otros innovadores herejes de Alemania; en parte también por los príncipes vecinos y otros, que por enemistad y envidia me han sido siempre contrarios, metiéndome en peligrosas guerras, de las cuales, con el favor divino, hasta este día he salido felizmente. Además, concerté con diversos príncipes alianzas y pactos, que no se guardaron y me forzaron a cambiar de parecer, y hacer otras jornadas de guerra y de paz. Nueve veces fui a Alemania, seis he estado en España, siete en Italia, diez he venido a Flandes, cuatro veces tanto en tiempo de paz como de guerra he entrado en Francia, dos en Inglaterra y otras dos fui contra África. Todas suman cuarenta, sin contar otros que realicé para visitar mis tierras. Para ello he navegado ocho veces el mar Mediterráneo y tres el Océano de España [el Atlántico hasta España], y ahora será la cuarta que volveré a pasarlo para sepultarme. [...] En lo que toca al gobierno confieso haberme equivocado muchas veces, engañado con el verdor y brío de mi juventud, por mi poca experiencia o por otro defecto de la flaqueza humana. Y os garantizo que no hice jamás cosa alguna en que quisiese agraviar a alguno de mis vasallos ni permití que se les hiciese agravio alguno [...] Pido y ruego a todos los que aquí estáis me perdonéis y me hagáis gracia de este error o de otra queja que de mí se pueda tener."

    "num": 15,
    "titulo": "Modelos políticos opuestos: absolutismo francés y parlamentarismo británico",
    "texto": "Barrington Moore Jr. (1913-2005)\nFragmentos de su obra \"Los orígenes sociales de la dictadura y de la democracia\". [primera edición, 1966].\n\nFragmento 1: [En Inglaterra] bajo la presión de las circunstancias, la noción medieval que llevaba a juzgar los hechos económicos conforme a su contribución a la salud del organismo social entró en crisis. Cesó de creerse que el problema agrario consistía en hallar el mejor método posible de mantener a las gentes en la tierra y empezó a considerarse que era cuestión de dar con la mejor manera posible de invertir capital en ella. Se empezó a tratar a la tierra, cada vez más, como algo que podía comprarse y venderse, sujeto a uso y abuso, en una palabra, como propiedad privada capitalista moderna. [Debemos recordar que durante] el feudalismo, la propiedad de la tierra había llevado siempre aparejadas las cargas y trabas de una gran variedad de obligaciones respecto a otras personas. El proceso por el que esas obligaciones desparecieron, y quién salió ganando o perdiendo con el cambio, implicó encrucijadas políticas de suma trascendencia en todos los países que conocieron el feudalismo. En Inglaterra las novedades emergieron pronto a la superficie. [...] Mucho antes de Adam Smith, grupos dispersos de ingleses residentes en el campo empezaron a considerar el interés privado y la libertad económica como la base natural de la sociedad humana. [...]\n\nFragmento 2: Uno de los signos más reveladores del cambio de perspectivas fue el boom en el mercado de tierras que empezó alrededor de 1580 y duró aproximadamente medio siglo. Las rentas anuales subieron a un tercio del precio de venta de las fincas pocas décadas antes.[...] Movidos por la perspectiva de las ganancias que obtendrían ya por la venta de lana ya por el arrendamiento de sus tierras a los que se dedicaban a ello, con aumento de sus rentas, los señores encontraron una gran variedad de métodos legales y semilegales para privar a los campesinos de sus derechos de cultivo en los campos abiertos y asimismo de sus derechos a utilizar las tierras comunales para apacentar sus ganados, recoger leña, y otros por el estilo. [...] No cabe duda que una cantidad considerable de tierra anteriormente sujeta a normas consuetudinarias que prescribían los métodos de cultivo se iban convirtiendo en tierras de los individuos [o sea, los grandes y medianos terratenientes] podían disponer a discreción.\n\nFragmento 3: Simultáneamente la comercialización de la agricultura significaba pasar del señor feudal [...] a un terrateniente más próximo a un avezado hombre de negocios que explotaba las riquezas materiales del dominio pensando en el provecho y el rendimiento. [Tales hábitos no estaban limitados a la aristocracia rural, pues] también se habían propagado entre las capas superiores del campesinado [constituidas] por los yeomen, una clase cuyos límites fueron definiéndose poco a poco entre la pequeña gentry arriba y los campesinos menos prósperos abajo. [Los principales ingresos de la yeomanry provenían de] la cría de ovejas [y del] cultivo de cereales comerciales. Los yeomen fueron la principal fuerza impulsora de las enclosures campesinas [mientras que los grandes terratenientes impulsaron cercamientos que dedicaban el área cercada, preferentemente, a la ganadería lanar].\n£\nPerry Anderson (1938-  ) [Historiador y ensayista político inglés, especialista en historia intelectual]\nFragmento de \"El Estado Absolutista\" [primera edición, 1974]\n[Para la monarquía francesa] el legado fundamental de los largos sufrimientos de la guerra de los Cien Años fue su contribución final a la emancipación fiscal y militar de la monarquía respecto de los límites del anterior sistema político medieval. En efecto, la guerra sólo pudo ser ganada gracias al abandono del sistema señorial de servicios de caballería -que se había mostrado desastrosamente ineficaz contra los arqueros ingleses- y con la creación de un ejército regular pagado, cuya artillería fue el arma decisiva de la victoria. Para poner en pie este ejército, la aristocracia francesa concedió el primer impuesto de amplitud nacional recaudado por la monarquía, la taille royale de 1439 [un impuesto directo que los socialmente menos privilegiados debían pagarle al rey], que se convirtió en regular con la taille des gens d'armes [impuesto destinado al mantenimiento de los hombres de armas] en la década de 1440. La nobleza, el clero y algunas ciudades quedaron exentas de su pago, y en el curso del siguiente siglo la definición legal de la nobleza en Francia fue, precisamente, la exención hereditaria de la taille [es decir, que los nobles, por el solo hecho de serlo, no pagaban impuestos al rey]. Así, la monarquía aparecía reforzada a finales del siglo XV hasta el punto de que ahora poseía un ejército regular embrionario en las compagnies d'ordonnance, capitaneadas por la aristocracia, y un impuesto fiscal directo que no estaba sujeto a ningún control representativo.\n£\nFragmentos del Bill of Rights (1689) [Carta de Derechos, aprobada por el Parlamento inglés y aceptada por los nuevos monarcas, Guillermo III de Inglaterra y María II de Inglaterra]\nLey de reivindicación de los derechos y libertades de los sujetos según la sucesión de la corona. Lores [señores] espirituales y temporales y comunes [representantes de los condados y burgos del reino reunidos en la Cámara de los Comunes], según la acreditación y elección de cada uno, reunidos ahora en la representación total y libre de esta nación, como en primer lugar lo hacían sus antepasados, para reivindicar y verificar sus antiguos derechos y libertades, indican:\n1. Que el deseo de poder de derogar las leyes o su ejecución por autoridad real sin el consentimiento del Parlamento es contrario a derecho.\n2. Que el deseo de poder de dispensar de las leyes o de su ejecución por la autoridad real, como últimamente se ha tomado y utilizado, es contrario a derecho.\n[...]\n4. Que la exacción de la contribución económica a la Corona es contraria a derecho durante más tiempo o de otra manera de lo permitido por el Parlamento sin que el Parlamento lo haya concedido por voluntad de derecho.\n5. Rectificar las peticiones al Rey en virtud del derecho de sus subordinados y que cualquier detención o denuncia al respecto sea contrarias a derecho.\n6. Si la creación o mantenimiento de un ejército en tiempo de paz dentro del reino no es conforme del Parlamento, es contrario a derecho.\n7. Que los súbditos protestantes pueden tener armas para defenderse en sus condiciones y de acuerdo con lo previsto por el derecho.\n8. Que la elección de los miembros del Parlamento debe ser libre.\n9. Que la libertad de expresión y los debates o actuaciones del Parlamento no deben ser objeto de acusación ni de investigación por parte de ninguna jurisdicción o institución ajena al propio Parlamento.\n[...]\n12. Cualquier imposición, multa y exacción sin sanción judicial, nula por oposición a derecho.\n13. Y que para corregir las injusticias y modificar, reforzar y mantener las leyes, el Parlamento tiene que reunirse con frecuencia.\nSegundo. Los citados lores espirituales y temporales y los comunes, reunidos en Westminster, deciden que Guillermo y María, príncipe y princesa de Orange, son Reyes y Reina de Inglaterra, Francia, Irlanda y de todos los territorios bajo sus órdenes.\n[...]\nCuarta. Y a Sus Majestades les ha parecido que los lores espirituales y temporales y los comunes, formados por dos Cámaras de la Asamblea, deben seguir en su lugar y, junto con Sus Majestades Reales, redactar un reglamento para restaurar las leyes y libertades religiosas del reino, de modo que no corran el riesgo de destrucción de ninguno de los dos en el futuro; y, los lores espirituales y temporales y los comunes mencionados, a esto le han dado el sí y han actuado de acuerdo con ello."

  {
    "num": 16,
    "titulo": "Capitalismo global: centros, periferias y la nueva dependencia",
    "texto": "Richard Hakluyt (1552-1616)\nFragmentos de \"The Principal Navigations, 1589\" [Los principales viajes de la nación inglesa]\n\nFragmento 1: Pieles preciosas en excepcional cantidad; también tal abundancia de aceite de ballena para hacer jabón, y de pescado como para abastecer a una tercera parte de Europa — bien puedo con razón y autoridad concluir que todas las mercancías de todos nuestros viejos comercios decaídos y peligrosos en toda Europa, África y Asia que frecuentamos, podrán en breve tiempo, por poco o nada, y muchas por el solo trabajo artesanal, en cierta manera obtenerse en aquella parte de América que se extiende entre los treinta y los sesenta grados de latitud norte, si por nuestra negligencia no permitimos que los franceses u otros nos anticipen.\n\nFragmento 2: Es bien digno de observación ver y considerar qué han producido los semejantes viajes de descubrimiento y plantación en las Indias Orientales y Occidentales en los reinos de Portugal y España; ambos reinos, siendo de por sí pobres y estériles y apenas capaces de sostener a sus habitantes, por sus descubrimientos han encontrado tal ocasión de empleo que durante estos muchos años apenas hemos oído hablar de un solo pirata de esas dos naciones; mientras que nosotros y los franceses somos los más infames por nuestras ultrajes, comunes y cotidianas piraterías. ¿Y cuando escuchamos hablar de un ladrón entre ellos? La razón es que, por estos sus nuevos descubrimientos, tienen tantas formas honestas de ponerles a trabajar que más bien les faltan hombres que medios para emplearlos.\n£\nKarl Marx (1818-1883)\nFragmento de \"Das Kapital\" [El Capital, primera edición del año 1867)\nEl sistema colonial maduró el comercio y la navegación. Las compañías coloniales actuaron como poderosas palancas para la concentración del capital. Las colonias suministraron un mercado, con la perspectiva de una acumulación acelerada y avanzada como consecuencia del monopolio de la metrópoli sobre ese mercado. Los tesoros capturados fuera de Europa mediante el saqueo descarado, la esclavización y el asesinato, fluyeron de vuelta hacia Europa y fueron convertidos en capital. Hoy la supremacía industrial trae consigo la supremacía comercial. En el período manufacturero es lo contrario: la supremacía comercial produce la predominancia industrial.\n£\nPeter Kriedte [historiador económico alemán y referente académico en los estudios sobre la transición del feudalismo al capitalismo]\nFragmento de su libro \"Feudalismo tardío y capital mercantil\"\nEn búsqueda de una solución para la caída de la tasa de cargas feudales, la nobleza ampliaba sus reservas apropiándose tierras no cultivadas o tierras de campesinos e integrándolas en sus dominios. A partir de allí cabían dos posibilidades:\n1) La nobleza explotaba por cuenta propia sus dominios ampliados, ya sea con los campesinos sujetos a prestaciones de trabajo personal, como en Europa centro-oriental y oriental (fincas, dominios señoriales), o con fuerza de trabajo dependiente, como en el sur de España e Italia (latifundios).\n2) La nobleza volvía a dar la tierra apropiada [por ella], pero no ya como en enfiteusis sino en arrendamiento, pues éste podía adaptarse sin grandes dificultades al nivel de precios.\nMientras que la primera solución, el llamado dominio señorial, implicó la refeudalización de las relaciones de producción agrarias, la segunda solución apuntó más allá del modo de producción feudal, sobre todo cuando se la completó, como en Inglaterra, con el cercado de las tierras correspondientes. Los campesinos fueron expropiados. El mercado se convirtió en regulador de la relación entre los señores y los nuevos poseedores de la tierra. La renta feudal se convirtió en renta capitalista de la tierra. A esto último se lo conoce en Historia como la \"vía inglesa\" al capitalismo, y consistió en la eliminación del campesinado [quedando en el medio rural el gran terrateniente que percibía renta, el gran arrendatario que percibía ganancia y el obrero rural que percibía salario].\n£\nImmanuel Wallerstein (1930-2019) [Sociólogo y científico social estadounidense que llegó a ser el principal teórico del análisis del sistema-mundo].\nFragmento de su libro \"El moderno sistema mundial\" (primera edición de 1974)\nA finales del siglo XV y principios del siglo XVI, nació lo que podríamos llamar una economía-mundo europea. No era un imperio, pero no obstante era espaciosa como un gran imperio y compartía con él algunas características. Pero era algo diferente y nuevo. Era un tipo de sistema social que el mundo en realidad no había conocido anteriormente, y que constituye el carácter distintivo del moderno sistema mundial. Es una entidad económica pero no política, al contrario que los imperios, las ciudades-Estado y las naciones-Estado. De hecho, precisamente comprende dentro de sus límites (es difícil hablar de fronteras) imperios, ciudades-Estado, y las emergentes \"naciones-Estado\". Es un sistema \"mundial\", no porque incluya la totalidad del mundo, sino porque es mayor que cualquier unidad política jurídicamente definida. Y es \"economía-mundo\" debido a que el vínculo básico entre las partes del sistema es económico [...]. Por el contrario, un imperio es una unidad política [...]. En este sentido los imperios fueron una característica constante del panorama mundial a lo largo de cinco mil años. [...] La centralización política de un imperio constituía al mismo tiempo su fuerza y su mayor debilidad. Su fuerza se basaba en el hecho de que garantizaba flujos económicos desde la periferia hacia el centro por medio de la fuerza (tributos e impuestos) y de ventajas monopolísticas de comercio. Su debilidad yacía en el hecho de que la burocracia necesaria para su estructura política tendía a absorber un exceso de los beneficios, especialmente cuando la represión y la explotación originaban revueltas que aumentaban los gastos militares. Los imperios políticos son un medio primitivo de dominación económica."
  },
  {
    "num": 17,
    "titulo": "La riqueza en metales y el control estatal de la economía",
    "texto": "Isaac Ilych Rubin (1886-1937) [Economista e historiador de la economía]\nFragmento de su obra \"Una historia del pensamiento económico\", (primera edición rusa de 1924)\nA medida que el capitalismo se desarrollaba [las] actitudes medievales hacia la actividad económica se convirtieron en obsoletas. El ideal antiguo había sido la economía natural autosuficiente; ahora la burguesía naciente y la corona estaban poseídos de una apasionada sed de dinero. Anteriormente, el comercio profesional había sido considerado un pecado; ahora, el comercio internacional era considerado como la principal fuente de la riqueza de una nación, y se aplicaban todas las medidas en un esfuerzo para expandirlo. En tiempos previos, el cobro de intereses estaba prohibido; ahora, la necesidad de desarrollar el comercio y el crecimiento de una economía monetaria significaba que o bien se encontraban vías para eludir estas proscripciones o directamente se las desechaba.\nEn correspondencia con los intereses de un capital y una burguesía comercial en su etapa infantil, los nuevos puntos de vista económicos encontraron sus defensores en los mercantilistas. Este apelativo se usa para designar a un vasto número de escritores de los siglos XVI a XVIII que vivieron en diversos países de Europa y se ocuparon de temas económicos. El volumen de sus escritos fue enorme, aunque muchos sólo de interés ocasional y ya no se los recuerda. Tampoco puede decirse que todos los mercantilistas profesaran la 'teoría mercantilista': en primer lugar, porque no estaban en modo alguno de acuerdo en todas las cuestiones, y en segundo lugar porque en ninguna parte de sus trabajos se encuentra una 'teoría' unificada que abarque todos los fenómenos económicos. El tenor de la literatura mercantilista fue más bien práctico que teórico, y estaba mayoritariamente dedicado a aquellas cuestiones cotidianas específicas que se les presentaban por el desarrollo del capitalismo temprano y que demandaban una solución práctica con urgencia. El cercamiento de las tierras comunales y la exportación de lana; los privilegios de los mercaderes de ultramar y los monopolios otorgados a las compañías comerciales; las prohibiciones a la exportación de metales preciosos y los límites al nivel de la tasa de interés; la posición de la moneda inglesa en relación con las de otros países y las fluctuaciones de su tipo de cambio –todas estas cuestiones eran de preocupación vital práctica para la burguesía mercantil inglesa de la época y constituyeron la preocupación principal de la literatura mercantilista inglesa- la más avanzada de Europa.\n£\nJohn Hales (¿? - 1572)\nFragmentos de \"Discurso sobre el bien común de este reino de Inglaterra (impreso en 1581)\"\nFragmento 1: Y especialmente, que permitimos que nuestras propias materias primas se vayan al exterior, poniendo a trabajar a los extranjeros, para luego comprárselas de nuevo; pues de nuestra lana fabrican y tiñen telas, paños y gorros más allá del mar, y los traen aquí de vuelta para venderlos; nótese bien, les ruego, cuánto nos hacen pagar al final por nuestras propias materias: el arancel extranjero, la mano de obra y los tintes, y por último el segundo arancel cuando las mercancías regresan al reino; mientras que, si se trabajara dentro de nuestro propio reino, nuestros propios hombres tendrían trabajo [...], el arancel lo pagarían los extranjeros al rey, y las ganancias netas quedarían dentro del reino.\n\nFragmento 2: Y en cuanto a algunas cosas, las fabrican con nuestras propias materias primas y nos las devuelven; con lo cual ponen a trabajar a su propia gente y extraen gran cantidad de riqueza de este reino. De nuestra lana hacen paños, gorros y telas; de nuestras pieles hacen cueros españoles, guantes y cinturones; de nuestro estaño, saleros, cucharas y platos; de nuestros trapos de lino roto, papel blanco y pardo. ¿Qué riqueza, pensáis, sale de este reino por cada una de estas cosas?\n£\nThomas Mun (1571-1641)\nFragmentos de \"El tesoro de Inglaterra por el comercio exterior (publicado por su hijo en 1664)\"\nFragmento 1: Capítulo II: Los medios para enriquecer este Reino y aumentar nuestro Tesoro.\nAunque un reino pueda enriquecerse con los regalos recibidos o con las compras realizadas a otras naciones, estas son cosas inciertas y de poca importancia cuando suceden. El comercio exterior es la regla de nuestro tesoro. Por lo tanto, el medio habitual para aumentar nuestra riqueza y tesoro es el comercio exterior, en el cual debemos observar siempre esta regla: vender anualmente a extranjeros más de lo que consumimos de ellos en valor. Pues supongamos que cuando este Reino está plenamente abastecido con tela, plomo, estaño, hierro, pescado y otros productos autóctonos, exportamos anualmente el excedente a países extranjeros por un valor de dos mil doscientas libras; de esta manera podemos comprar y traer más allá de los mares mercancías extranjeras para nuestro uso y consumo, por un valor de dos mil libras; con este orden debidamente mantenido en nuestro comercio, podemos estar seguros de que el Reino se enriquecerá anualmente en doscientas libras, que deben traerse a nosotros en tal cantidad de tesoro; porque esa parte de nuestras existencias que no se nos devuelve mercancías debe necesariamente traerse a casa en tesoro.\n\nFragmento 2: Capítulo III: as formas y medios específicos para aumentar la exportación de nuestros productos básicos y disminuir nuestro consumo de mercancías extranjeras.\nAunque este Reino ya es sumamente rico por naturaleza, podría incrementarse mucho más destinando los terrenos baldíos (que son infinitos) a empleos que no obstaculicen de ninguna manera los ingresos actuales de otras tierras en uso, [pues conviene destinar los terrenos que hoy están baldíos al cultivo de productos que hoy importamos, como ser el] cáñamo, lino, cordelería, tabaco y otras cosas diversas que ahora traemos de extranjeros, lo que nos empobrece enormemente. Asimismo, podríamos disminuir nuestras importaciones si nos abstuviéramos con sensatez del consumo excesivo de productos extranjeros en nuestra dieta y , ya que los cambios frecuentes de modas aumentan aún más el despilfarro y los gastos; vicios que en la actualidad son más notorios entre nosotros que en épocas pasadas. Sin embargo, podrían enmendarse fácilmente haciendo cumplir las buenas leyes que se practican estrictamente en otros países contra dichos excesos; donde, al exigir el uso de sus propias manufacturas, impiden la entrada de otras, sin prohibición ni ofensa a los extranjeros en su comercio mutuo.\n\nFragmento 3: El excedente de nuestros productos, que los extranjeros utilizan y que también pueden obtener de otras naciones [...] nos obliga a esforzarnos por venderlos lo más baratos posible [pues] Pues en los últimos años hemos comprobado, por buena experiencia, que al poder vender nuestras telas baratas en Turquía, hemos aumentado considerablemente su salida, y los venecianos han perdido tanto en la salida de las suyas en esos países, porque son más caras.[...] Descubrimos que veinticinco por ciento menos en el precio de estos y otros productos, a costa de las ganancias de los particulares, pueden generar más de cincuenta por ciento en la cantidad vendida para beneficio del público. Pues cuando la tela es cara, otras naciones se dedican a la confección de ropa, y sabemos que no les faltan ni la habilidad ni los materiales para ello. Pero cuando, mediante la abaratación, las expulsamos de esta actividad y, con el tiempo, recuperamos nuestro precio elevado, entonces también recurren a su antiguo método.[...] El valor de nuestras exportaciones también puede incrementarse considerablemente cuando las realizamos nosotros mismos en nuestros propios barcos, pues entonces no solo obtenemos el precio de nuestras mercancías como valen aquí, sino también las ganancias de los comerciantes, los costos del seguro y el flete para transportarlas más allá de los mares.[...] Y si bien es cierto que el comercio debería ser libre para que los extranjeros lo traigan y lo lleven a cabo a su antojo, sin embargo, en muchos lugares la exportación de alimentos y municiones está prohibida, o al menos limitada a ser realizada únicamente por la gente y los barcos de aquellos lugares donde abundan.\n£\nWilliam Petty (1623-1687)\nFragmento de \"Aritmética política, 1676\".\nLas principales conclusiones de este tratado son: Que un país pequeño, y pocos habitantes, pueden, por su situación, comercio y política, ser equivalentes en riqueza y poder a un pueblo y territorio mucho mayores. Y, en particular, cómo las facilidades para el transporte marítimo y fluvial contribuyen de manera eminente y fundamental a ello. Que algún tipo de impuestos y contribuciones públicas pueden, más que disminuir, aumentar el patrimonio común. Que Francia no puede, por razones de impedimentos naturales y perpetuos, ser más poderosa en el mar que los ingleses o los holandeses. Que el pueblo y los territorios del rey de Inglaterra son, naturalmente, casi tan importantes en riqueza y poder como los de Francia. Que los impedimentos para la grandeza de Inglaterra son solo contingentes y eliminables. Que el poder y la riqueza de Inglaterra han aumentado en estos cuarenta años. Que la décima parte del total de los gastos de los súbditos del Rey de Inglaterra es suficiente para mantener a cien mil infantes, treinta mil jinetes y cuarenta mil marineros, y para sufragar todos los demás gastos del Gobierno, tanto ordinarios como extraordinarios, si se recaudaran y gravaran regularmente. Que hay suficientes manos disponibles entre los súbditos del Rey de Inglaterra para ganar dos millones al año, más de lo que ganan ahora, y hay empleos listos, adecuado y suficiente para tal fin.\n£\nJean Baptiste Colbert (1619-1683)\nFragmento de \"Proyecto de Mr. Colbert al rey Luis XIV de Francia sobre el comercio, 1664\"\nSeñor. El comercio, estéril con el ruido de los ejércitos, puede al presente reparar sus pérdidas, y derramar sobre el reinado de V.M. un esplendor que oscurezca a los más dichosos reinos. Hacer la paz es hacer la guerra a nuestros enemigos: su idea de combatir nuestras fuerzas sin dejarlas crecer, les proporciona toda su seguridad, y aleja de nosotros estas victorias adquiridas por continuados esfuerzos. Que descanse el valor en medio de nuestros campos: que la industria nos descubra un camino fácil a la conquista de la Europa: que suceda a una guerra tan larga una paz dilatada [...] y que la Francia, superior por las ventajas de su comercio, haga reconocer a los reinos vecinos el señorío a que la destina el cielo, engrandeciéndola con sus riquezas, que son los primeros principios a que se refieren todas las reglas convenientes a la administración del comercio. El comercio es el que trueca los frutos distribuidos por la naturaleza en diferentes lugares, y hace que un interés recíproco nos los comunique: todos esos frutos se nos hacen comunes circulando de un país a otro, hasta que los consume nuestra necesidad. Es la circulación la esencia del comercio, y el consumo su fin.[...] La fertilidad de un Estado y la industria de los pueblos son el origen del comercio: débese a la fertilidad todo lo que la extensión del país y las diferentes ventajas del terreno pueden producir ; y a la industria los diversos usos en que se emplean las producciones de la naturaleza, ya provengan de nuestro propio suelo, ya del extraño.[...] Los comercios esenciales para nosotros son todo lo que respeta a la agricultura, a la pesca en todos los mares, a las artes y fábricas, en las que se emplean las producciones de la tierra. Los comercios menos útiles son aquellos en los cuales contribuye necesariamente el extrangero en derechura y sin perjuicio; y los comercios onerosos son aquellos en que, sin que los necesitemos, se aprovecha y asegura de una ganancia que cede en desventaja nuestra.\nAsí la solidez del comercio consiste en la diversidad de frutos de bienes que produce un país fértil: su progreso en la extensión que recibe con la actividad de la industria. No falta pues a los\nfranceses la actividad, pero no se aprovechan de ella. Su genio es muy propenso al comercio; pero le aplican a falsos comercios, porque los medios conducentes a éstos les parecen más fáciles, las ganancias más prontas, y siempre toleradas. Es menester volverlos a conducir al comercio natural por el atractivo de las mayores ganancias, y entonces ningún terreno habrá que no aproveche en todos los usos para que sea a propósito: no habrá descuido en la agricultura, ninguna producción que no tome tantas formas cuantas sean los usos a que pueda acomodarse. Se avivarán entonces las artes. ¡Qué de fuerzas habrá, y se aumentarán en la navegación! ¡Qué opulencia en las fábricas! La felicidad de los vasallos llegará á su último término."

    "texto": "Fragmento del \"Decreto sobre las imágenes del Concilio de Trento, 1563\"\nConcilio de Trento. Sesión 25. Decreto sobre las imágenes\nManda el santo Concilio a todos los Obispos, y demás personas que tienen el cargo y obligación de enseñar, que instruyan con exactitud a los fieles ante todas cosas, sobre la intercesión e invocación de los santos, honor de las reliquias, y uso legítimo de las imágenes, según la costumbre de la Iglesia Católica y Apostólica, recibida desde los tiempos primitivos de la religión cristiana, y según el consentimiento de los santos Padres, y los decretos de los sagrados concilios; enseñándoles que los santos que reinan juntamente con Cristo, ruegan a Dios por los hombres; que es bueno y útil invocarlos humildemente, y recurrir a sus oraciones, intercesión y auxilio para alcanzar de Dios los beneficios por Jesucristo su hijo, nuestro Señor, que es el único redentor y salvador nuestro [...] se deben tener y conservar, principalmente en los templos, las imágenes de Cristo, de la Virgen madre de Dios, y de otros santos, y que se les debe dar el correspondiente honor y veneración: no porque se crea que hay en ellas divinidad, o virtud alguna por la que merezcan el culto, o que se les deba pedir alguna cosa, o que se haya de poner la confianza en las imágenes, como hacían en otros tiempos los gentiles, que colocaban su esperanza en los ídolos; sino porque el honor que se da a las imágenes, se refiere a los originales representados en ellas; de suerte, que adoremos a Cristo por medio de las imágenes que besamos, y en cuya presencia nos descubrimos y arrodillamos; y veneremos a los santos, cuya semejanza tienen: todo lo cual es lo que se halla establecido en los decretos de los concilios, y en especial en los del segundo Niceno contra los impugnadores de las imágenes.[...] Enseñen con esmero los Obispos que por medio de las historias de nuestra redención, expresadas en pinturas y otras copias, se instruye y confirma el pueblo recordándole los artículos de la fe, y recapacitándole continuamente en ellos: además que se saca mucho fruto de todas las sagradas imágenes, no sólo porque recuerdan al pueblo los beneficios y dones que Cristo les ha concedido, sino también porque se exponen a los ojos de los fieles los saludables ejemplos de los santos, y los milagros que Dios ha obrado por ellos, con el fin de que den gracias a Dios por ellos, y arreglen su vida y costumbres a los ejemplos de los mismos santos.\n£\nThéophile de Viau (1590-1626)\nManifiesto estético al final de su \"Elegía a una dama\" (1620)\nQuiero hacer unos versos que no estén obligados, / pasear mi mente entre pequeños anhelos, / buscar lugares secretos donde nada me moleste / meditar en el ocio, soñar a mis anchas, / utilizar la hora entera en mirarme en el agua, / escuchar cómo inquiere su camino un arroyo, / escribir en el bosque, interrumpirme, callarme, / componer un cuarteto sin pensar en hacerlo. / Y después de satisfacerme por tan dulce error, / quiero un gran propósito que acalore mi furia, / que una obra de diez años me tenga embebido / y cualquiera que sea este tan bello poema, represente / allí, si a mis deseos no le faltan poderes, / que merece la pena tan grato deber. / A tan alta empresa se ha comprometido mi genio: / haría falta inventar un nuevo lenguaje, / tomar un ser nuevo, un mejor pensar y decir / que nunca hayan pensado los hombres y los dioses.\n£\nCarlos de Sigüenza y Góngora (1645-1700)\nFragmentos de \"Teatro de virtudes políticas que constituyen a un príncipe, 1680\"\nFragmento 1: Los que miran aquellas imágenes de reyes que despiden fulgor por el esplendor de sus colores, que hacen resplandecer la púrpura de flor marina, cuya diadema fulgura con los centelleos de la pedrería circundando las sienes, ésos, ciertamente, quedan atónitos con tal espectáculo, y al instante, en el arrebato de su admiración, se representan la hermosura del modelo.\nFragmento 2: Siendo mi intento proponer al excelentísimo señor marqués de la Laguna un teatro de virtudes políticas para que, sirviéndole de espejo, se le pudiera decir con Plutarco: 'Como en un espejo adorna y compara tu vida con las ajenas virtudes'.\n£\nGisbertus Voetius (1589-1676)\nRESUMEN PERSONAL SOBRE VOETIUS Y SU VISIÓN ESTÉTICA CALVINISTA\nVoetius fue conocido como el \"defensor de la ortodoxia reformada\" y fue el teólogo de la piedad calvinista conocida como la Nadere Reformatie — la Segunda Reforma Holandesa, comparable al puritanismo inglés. Escribió prolíficamente: libros de teología, guías devocionales y sobre todo escritos polémicos contra el catolicismo romano, el arminianismo y el cartesianismo.\nSu posición sobre las imágenes en las iglesias no era un ataque al barroco como estilo artístico sino una defensa de la iconoclasia reformada: las iglesias deben estar despojadas de toda imagen, estatua y ornamento porque éstos constituyen idolatría. Esto está en su Politica Ecclesiastica (1663-1676) y en las Selectae Disputationes (1648-1669), ambas en latín y sin traducción al inglés disponible. En el contexto holandés del siglo XVII, el calvinismo y la cultura visual eran modos centrales de auto comprensión, y existía una desconfianza fundamental hacia las imágenes religiosas. Las iglesias calvinistas fueron purgadas de imágenes durante los disturbios iconoclastas del siglo XVI.\nLo que Voetius argumentó contra las imágenes en las iglesias:\n1. Las imágenes son ídolos. Voetius sostuvo que cualquier imagen religiosa en una iglesia viola el segundo mandamiento — \"No te harás imagen tallada\" — sin excepción posible. La distinción católica entre latría (adoración) y dulía (veneración) le parecía una sofistería sin fundamento bíblico.\n2. El arte barroco es propaganda del Anticristo. Para Voetius, Roma usaba el arte espectacular deliberadamente para seducir a los fieles con los sentidos en lugar de instruirlos con la Palabra. La belleza sensorial era una trampa — exactamente lo opuesto al principio reformado de que solo la Escritura puede mover al creyente.\n3. Las iglesias deben ser espacios de la Palabra, no del espectáculo. En su Politica Ecclesiastica estableció que el único ornamento legítimo de una iglesia reformada era el púlpito. Todo lo demás — pinturas, estatuas, música elaborada, arquitectura escenográfica — era distracción mundana contraria al culto verdadero."

    "texto": "Tomás Moro (1478-1535)\nFragmentos sobre \"Utopía, 1516\"\n\nFragmento 1: Sobre la comunidad de bienes y la ausencia de dinero\n\"Cualquiera de las Ciudades se subdivide en cuatro Distritos iguales, cada uno de los cuales tiene en su centro una plaza donde se hallan los almacenes generales comunes a todos. Hay lugares determinados donde se llevan los productos del trabajo propios de cada familia. Cada especie de alimentos se conservan en silos apropiados por cada clase. De estos almacenes cada padre de familia saca todo aquello que necesita para sí y para los suyos, sin dinero ni nada que lo sustituya. ¿Por qué se le negará nada si allí hay abundancia de todo, y Sin temor a que nadie pida más de lo que necesita? ¿Y qué objeto puede tener el pedir con exceso cuando se está seguro de que no faltará nada de lo necesario? Es cosa manifiesta que cuando no hay temor de que falte lo que se necesita, cesa la ambición de querer acumular aquella clase de bienes, y como esta ambición no se da en Utopía, viven perfectamente tranquilos\"\n\nFragmento 2: Sobre la jornada laboral y el estudio\n\"Dividen el día y la noche en veinticuatro horas, dedicando seis horas diarias al trabajo, tres por la mañana, al final de las cuales van a comer. Tienen una siesta de dos horas después de la comida, y una vez descansados vuelven al trabajo por otras tres horas, que se terminan con la cena. [...] A las ocho se retiran a dormir durante ocho horas. En los intervalos de comer, cenar y dormir, cada uno emplea su tiempo con lo que mejor cuadra con su libre albedrío; pero no de manera que se disipe en excesos y holgazanerías, sino que libre de su trabajo se ocupe en algún ejercicio honesto de su elección. La mayor parte de estas horas libres las dedican a los estudios literarios, ya que es costumbre que haya lecciones públicas antes del amanecer; a las que por obligación solamente asisten aquellos que están encargados y escogidos para cuidar del estudio\"\n\nFragmento 3: Sobre las leyes y la exclusión de abogados\n\"Tienen pocas leyes, y abominan a los pueblos que llenan volúmenes y volúmenes con glosas, reglamentaciones, órdenes y disposiciones. Consideran como una iniquidad el obligar a los hombres con tantas leyes que no se pueden siquiera leer todas, y tan complicadas que no son inteligibles. No admiten que haya abogados, porque quieren que ante los Tribunales cada parte exponga su razón, ya que de esta manera se habla menos y se llega mejor a la verdad cuando se expone sin exuberancia de palabras. Los jueces despachan las causas con solicitud, y favorecen sistemáticamente a la gente sencilla contra los astutos y malignos. Así ocurre que en Utopía todos son jurisconsultos, porque tienen pocas leyes...\"\n£\nTommaso Campanella\nFragmentos de \"La Ciudad del Sol (1623)\"\n\nFragmento 1: \"Ellos dicen que la propiedad en cualquiera de sus formas nace y se fomenta por el hecho de que cada uno posee a título exclusivo casa, hijos y mujeres. De aquí surge el amor propio, pues cada cual aspira a enriquecer a sus hijos, encumbrarlos a los más altos puestos y convertirlos en herederos de cuantiosos bienes. Para conseguirlo, los poderosos y los descendientes de noble linaje defraudan al erario público; los débiles, los pobres y los de origen humilde se tornan avaros, intrigantes e hipócritas. Por el contrario, una vez que ha desaparecido el amor propio, subsiste solamente el amor a la colectividad.\" [...] En realidad, ninguno puede recibir regalos de los demás, pues la comunidad les concede cuanto necesitan. Y los Magistrados cuidan mucho de que nadie reciba más de lo que merece, pero tampoco le falte nada de lo necesario. Sin embargo, la amistad se manifiesta entre ellos en caso de guerra o de enfermedad, en el aprendizaje de las ciencias, ayudándose con enseñanzas recíprocas o auxilios mutuos, y a veces también con alabanzas, palabras, servicios y lo necesario a cada cual. Todos los coetáneos se llaman hermanos unos a otros .Al cumplir los veintidós años, reciben el nombre de padres; antes de dicha edad, se denominan hijos. [...] No lo entenderás bien, si antes no conoces su género de vida.\n\nFragmento 2: Ante todo, debes saber que hombres y mujeres usan casi la misma clase de vestido, apto para la guerra. La única diferencia está en que en las mujeres la toga cubre las rodillas, mientras que los hombres la llevan por encima de ellas. Unos y otras se coeducan en todas las artes. Después de cumplir el primer año y antes de llegar al tercero, los niños aprenden la lengua y el alfabeto [...] Pasado algún tiempo, empiezan a ejercitarse en la lucha, en la carrera, en el disco y en juegos con los que por igual se fortalecen todos los miembros. Hasta el séptimo año, van siempre descalzos y con la cabeza descubierta. Al mismo tiempo, van a los talleres de los diversos oficios (zapatería, cocina, herrería, carpintería, pintura, etc.). Después de cumplir los siete años y luego de haber aprendido las nociones matemáticas que al efecto se hallan dibujadas en las paredes, se aplican al estudio de todas las ciencias naturales [...] De aquí pasan todos al conocimiento de materias más difíciles (Matemáticas, Medicina y otras ciencias), ejercitándose constantemente en disputas y discusiones científicas. Andando el tiempo, los que más se han distinguido en una ciencia o arte mecánica, llegan a ser Magistrados de ellas. Siguiendo cada cual, a su juez y guía, salen al campo para estudiar y aprender experimentalmente todo lo relativo al pasto de los animales. El que aprende más artes y sabe ejercitarlas con mayor perfección, es considerado más noble y distinguido. Se burlan de nosotros que estimamos viles a los trabajadores y, por el contrario, tenemos por nobles a quienes no conocen arte alguno, viven en la ociosidad y poseen muchos esclavos consagrados a su pereza y lujuria. De aquí, como de una escuela de vicio, salen para desgracia del Estado tantos intrigantes y malhechores."

    "texto": "Cristóbal Colón (1451-1506)\nFragmento de su \"Diario de viaje, 1492\".\nMientras que, príncipes más cristianos, altos, excelentes y poderosos, Rey y Reina de España y de las Islas del Mar, nuestros Soberanos, este año presente 1492, después de que sus Altezas hubieran terminó la guerra con los moros gobernando en Europa, […] como consecuencia de la información que yo Había dado a Sus Altezas el respeto a los países de la India y de un príncipe, llamado Gran Can [Khan], que en nuestra lengua significa Rey de Reyes, cómo, en muchas ocasiones, él y sus predecesores habían enviado a Roma solicitando instructores que pudieran enseñarle a nuestro santo fe, y el santo Padre nunca concedió su petición, por lo que se perdieron numerosas personas, creyendo en la idolatría y doctrinas de perdición. Sus Altezas, como cristianos católicos, y príncipes que aman y promueven la santa fe cristiana, y son enemigos de la doctrina de Mahomet y de toda idolatría y herejía, decidido a enviarme, Cristóbal Colón, a la los países mencionados de la India, para ver a los mencionados príncipes, pueblos, y territorios, y para conocer su disposición y el método adecuado para convertirlos a nuestra santa fe; y además se ordenó que no debía proceder por tierra hasta el Este, como es costumbre, pero por una ruta occidental […] Así que, después de haber expulsado a los judíos de vuestros dominios, Sus Altezas, en el mismo mes de enero, me ordenaron proceder con un armamento suficiente hacia dichas regiones de la India, y para ello me concedió grandes favores y me ennoblió para que a partir de entonces me llamara Don y ser Alto Almirante de el mar, y el virrey y gobernador perpetuos en todas las islas y continentes que podría descubrir y adquirir, o que podrían posteriormente descubrió y adquirió en el océano […].\n£\nFragmento de la \"Carta de Cristóbal Colón a Isabel y Fernando anunciando el Descubrimiento del Nuevo Mundo, 1493\". [La carta fue dirigida primero a Luis de Santangel, ministro de finanzas del rey Fernando II, y uno de los financistas del viaje de Colón].\n[Los indios] cuando perciben que están a salvo, dejando a un lado todo miedo, son de modales sencillos y De confianza y muy liberal con todo lo que tienen, sin rechazar a nadie que pida nada pueden poseer, e incluso ellos mismos, invitándonos a pedir cosas. Muestran un mayor amor por todos los demás que por ellos mismos; Ofrecen cosas valiosas por trivialidades, estando incluso satisfechos con un retorno muy pequeño, o sin nada; sin embargo, prohibía que cosas tan pequeñas y sin valor Deben entregarse, como platos, platos y vasos, así como llaves y cordones, consejos aunque si iban a conseguirlos, les parecía que era lo más bonito joyas del mundo. Ocurrió, efectivamente, que cierto marinero obtuvo a cambio de un cordón de zapatos puntas de oro equivalentes a tres monedas de oro; y también otras cosas para artículos de muy poco valor, especialmente para monedas nuevas de plata y algunas monedas de oro, para obtener daba lo que el vendedor deseaba, como por ejemplo una onza y media y dos onzas de oro, o treinta y cuarenta libras de algodón, con los que ya estaban familiarizados.\n£\nMiguel de Cúneo (1448-1505) [También es citado a veces como Michele da Cuneo, fue un navegante y cronista italiano originario de Savona, conocido por acompañar a Cristóbal Colón en su segundo viaje al Nuevo Mundo (1493-1496)]. Fragmento de \"Cartas y relaciones coetáneas\" [Obra de J. Gil que compila cartas de exploradores y cronistas del período temprano de la conquista española]\nAl penetrar en aguas españolas se nos murieron alrededor de doscientos de los dichos indios [que traían en condiciones de esclavos para ser vendidos en España], que arrojamos al mar, y creo que la causa de ello fue el frío al no estaban acostumbrados [...] No son gente apropiada para el trabajo pesado, sufren mucho el frío y no tienen larga vida.\n£\nPascual de Andagoya (1495-1548)\nFragmento de \"Relaciones y documentos\"\n[Se habla acerca de los esclavos indios llevados al Darién en tiempos del gobernador Pedrarias de Ávila, 1514-1517] Todas estas gentes que se traían, que fue mucha cantidad, llegados al Darién les echaban a las minas de oro, que había en la tierra buenas, y como venían del tan luengo camino trabajados y quebrantados de tan grandes cargas que traían, y la tierra era diferente de la suya, y no sana, se morían todos.\n£\nBartolomé de las Casas (1484-1566)\nFragmento de \"Historia de las Indias, Libro III, capítulo 46, p. 156\" [Esta obra fue escrita entre 1527 y 1561, pero quedó sin publicarse por más de trescientos años. Su primera publicación data de 1875-1876 y corrió a cargo de la sociedad formada por el Marqués de la Fuensanta del Valle y José Sancho Rayón. Ambos eran eruditos especializados en la publicación de documentos antiguos]\nCuanto más oro y riqueza adquirían, tantos más indios se les morían, y cuanto mayor número de ellos perecía y se iba despoblando la isla, tanta mayor prisa daban en hacer armadas para ir a buscar islas y saltear y robar gentes naturales que en ellas vivían, de la manera que se había hecho en esta isla.\n£\nVasco Núñez de Balboa (1475-1519)\nFragmento de \"Carta dirigida al Rey\", Santa María del Darién, 20 de enero de 1513.\nQue hasta aquí hemos tenido en más las cosas de comer que el oro, porque teníamos más oro que salud, que muchas veces fue en muchas partes que holgaba más hallar una cesta de maíz que otra de oro.\n£\nHernando Colón (1488-1539)\nFragmento de \"Historia del Almirante\" [escrita entre 1537 y 1539 por el hijo menor de Cristóbal Colón, pero publicada en Venecia en 1571]\n¡Así Dios me ayude! Ví a muchos que esperaban a la noche para comer la mazamorra, por no ver los gusanos que tenía. Otros estaban ya tan acostumbrados a comerlos que no los quitaban, aunque los viesen, porque si se detenían en esto perderían la cena.\n£\nPedro Mártir de Anglería (1457-1526)\nFragmento de \"Décadas del Nuevo Mundo\"\n[Relata la penurias que pasaron los españoles de la expedición de Diego de Nicuesa llevada a cabo entre 1509-1511] Se convinieron algunos compañeros en la compra de un perro flaquísimo que ya casi se estaba muriendo de hambre; le dieron al amo del perro muchos pesos de oro castellanos; le despellejaron para comérselo y la piel sarnosa, y en ella los huesos de la cabeza los tiraron a unos espinos próximos; al día siguiente un infante de ellos dio con la piel tirada llena de gusanos y que casi hedía. Llevósela a su casa; quitándole los gusanos la echó a cocer en una olla y cocida la comió. Acudieron muchos con sus platos, por el caldo de la piel cocida, ofreciéndole un castellano de oro por cada plato de caldo (...) Otro se encontró dos sapos; un enfermo se los compró para comérselos; y\ndicen que le dio por ellos dos camisas de lino recamado de oro, que valían seis castellanos. En cierto camino del campo se hallaron algunos un indígena muerto y ya pútrido; lo descuartizaron secretamente, y cociendo sus carnes mataron por entonces el hambre, cual si comieran pavos [...].\n£\nFray Toribio Benavente \"Motolinía\" (c. 1482–1568)\nFragmento de \"Historia de los indios de la Nueva España, Libro 1, capítulo 3, p. 131, (1541)\"\nSolo aquel que cuenta las gotas del agua de la lluvia y las arenas del mar puede contar todos los muertos y las tierras despobladas de Haití o isla Española, Cuba, San Juan, Jamaica y otras islas.\n£\nMichel de Montaigne (1533-1592)\nFragmento de \"Ensayos, Libro III, capítulo 6, p. 155, (1580)\".\nTantas ciudades arrasadas tantas naciones exterminadas, tantos millones de pueblos pasados a cuchillo y la parte más rica y hermosa del mundo trastocada por el negocio de las perlas y de la pimienta\".\n£\nWilliam H. McNeill (1917-2016) [Historiador canadiense que estudió con gran profundidad el desarrollo de las grandes pandemias a lo largo de la historia]\nFragmento de su libro \"Plagas y pueblos\" (1976)\n[...] en vista de lo ocurrido después de que los españoles inauguraran el libre intercambio de infecciones entre el Viejo y el Nuevo mundo, parece seguro que los encuentros amerindios con la enfermedad antes de la llegada de Colón no habían sido importantes desde un punto de vista epidemiológico. Los habitantes del Nuevo Mundo no eran portadores de ninguna infección grave transferible a los europeos y africanos que se introdujeron en su territorio […] mientras que, en cambio, la brusca confrontación con la larga nómina de infecciones que europeos y africanos habían ido recogiendo a lo largo de cuatro mil años de historia civilizada provocó un desastre demográfico masivo entre los amerindios.\n£\nWilliam Bradford (1590-1657)\nFragmento de \"Historia de la colonia de Plymouth, 1651\".\nSobre la gran epidemia entre los indígenas de Nueva Inglaterra (1633). Ahora voy a relatar algunos sucesos extraños y notables. Había un grupo de indígenas que vivía río arriba, en la región del río Connecticut, a gran distancia del puesto comercial que los ingleses tenían allí. Aproximadamente mil de ellos se habían encerrado en un fuerte que habían rodeado con una sólida empalizada. A comienzos del invierno, tres o cuatro holandeses fueron a vivir con ellos para comerciar. Pero su empresa fracasó. Pues quiso Dios visitar a estos indígenas con una gran enfermedad y una mortandad tal que, de mil personas, murieron más de novecientas cincuenta; y muchos de los cadáveres se pudrieron al aire libre por falta de sepultura. Aquella primavera también enfermaron de viruela los indígenas que vivían alrededor del puesto comercial y murieron de la manera más miserable. Ninguna enfermedad más terrible podía abatirlos; la temían más que a la peste. Por lo general, quienes contraían este mal quedaban cubiertos de pústulas. Y, por falta de camas, ropa de cama y otros auxilios, caían en una condición lamentable: yacían sobre esteras duras, mientras las pústulas reventaban, supuraban y se mezclaban unas con otras […] Y entonces, debilitados por el dolor, el frío y otros padecimientos, morían como ovejas podridas. La situación de aquel pueblo era tan deplorable y la enfermedad los abatió de manera tan generalizada que finalmente ya no podían ayudarse unos a otros: ni siquiera podían encender fuego, traer un poco de agua para beber o enterrar a sus muertos."

    "titulo": "Motores y cronología de la expansión ultramarina española",
    "texto": "Rugiero Romano (1923–2002) [Fue un historiador italiano muy influyente, especializado en historia económica y social de la Edad Moderna, particularmente de Europa meridional y de América Latina].\nFragmento de su obra \"Los conquistadores\"\n¿Quiénes son estos conquistadores? ¿Qué llegan a ser? […] lo que importa saber es quiénes eran, en su mayoría, estos conquistadores. Pobres diablos, segundones de familia mediana, pequeña o muy pequeña nobleza (a menudo, imaginaria…) que conocieron en sus hogares el modo de vida aristocrático, con sus mitos, sus ideales sus ambiciones, que la tierra de España no podía, en lo sucesivo, alimentar. Observemos de cerca la combinación social de los compañeros de Valdivia, en la época de la expedición por la conquista de Chile: dos caballeros notorios; dos caballeros; once hidalgos notorios; veintitrés hidalgos; tres probablemente hidalgos; nueve hombres de honra; seis mestizos; un esclavo; y, por último, ochenta y seis personas cuya condición [social] se ignora. Lo que en principio llama la atención, es que no aparece ningún Grande: no se encuentra en Chile, como no se lo encuentra en ninguna otra expedición americana. […] Se imponen dos consideraciones: en primer lugar, la ausencia de Grandes, entiéndase de grandes nobles; en segundo lugar, el gran número de caballeros y de hidalgos. Es probable que una parte de estas hidalguías sean engañosas; pero sabemos con bastante certidumbre que otras son indiscutibles. ¿Y ser hidalgo no significa, acaso, en la aceptación corriente del siglo XVI, ser noble, pero de poca fortuna? En estas condiciones, ¿por qué asombrarse de que la ambición general sea la de \"ir a valer más\"? […] afirmarse socialmente, imponerse, establecerse.\n£\nFragmentos de la \"Capitulación con Don Pedro de Mendoza para la conquista del Río de la Plata Toledo, 21 de mayo de 1534\".\nEL REY. [...] Primeramente, os doy licencia y facultad para que por Nos y en Nuestro nombre y de la Corona Real de Castilla, podáis entrar por el dicho río de Solís que llaman de la Plata, hasta la mar del Sur, donde tengáis doscientas leguas de largo de costa de gobernación, que comience desde donde se acaba la gobernación que tenemos encomendada al mariscal Don Diego de Almagro, hacia el estrecho de Magallanes, y conquistar y poblar las tierras y provincias que hubiere en las dichas tierras.\" […] \"Otrosí os haremos merced de título de Nuestro Adelantado de las dichas tierras y provincias que así descubriereis y poblareis en el dicho río de Solís, y en las dichas doscientas leguas; y asimismo os hacemos merced del oficio de alguacilazgo mayor de las dichas tierras, perpetuamente.\"[…] \"Otrosí, franqueamos á los que fuesen á poblar las dichas tierras y provincias, por seis años primeros siguientes [...] del almoxarifazgo de todo lo que llevaren para proviniento y provisión de sus casas\"[…] \"Así mismo, franqueamos á vos el dicho Don Pedro de Mendoza, por todos los días de vuestra vida, del dicho almoxarifazgo de todo lo que llevareis para proveimiento y provisión de vuestra casa\"[…] \"así mismo le Daremos poder, para que en Nuestro nombre, durante el tiempo de vuestra gobernación, hagáis la encomienda de indios de la dicha tierra, guardando en ellas las instrucciones y ordenanzas que os serán dadas.\""
