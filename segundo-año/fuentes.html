    "num": 22,
    "titulo": "Marco legal de la invasión: contratos, normas y requerimientos",
    "texto": "Texto del Requerimiento de 1513. [Fragmentos tomados de la siguiente URL: https://docs.google.com/viewer?a=v&pid=sites&srcid=ZGVmYXVsdGRvbWFpbn xuZXR3YXJtYXNpaXxneDo2ODcyYjliODE1MzE0NTI]\nFue redactado por Juan López de Palacios Rubios (1450-1524), quien fuera jurista y consejero real y encargado de sustentar la justicia de las empresas reales (le decían el \"sastre jurídico\"). Su obra De Justitia et Jure obtentionis ac retentionis regni Navarrae, fue la apología final de la conquista de Navarra. Autor también del Tratado de las Islas (1512), e inspirador de la legislación española para América, recogió ampliamente el concepto de la \"inmadurez\" de los indígenas, los cuales debían ser protegidos, como tiernos vástagos, hasta de sus propios defectos.\n\nFragmento 1: \"De parte de Su Majestad Rey de Castilla, etc; yo su criado, mensajero y capitán, os notifico y hago saber como mejor puedo: Que Dios nuestro señor uno y eterno, creó el cielo y la tierra, y un hombre y una mujer de quienes nosotros y vosotros y todos los hombres del mundo fueron sus descendientes procreados y todos los de después de nosotros vinieren (…) De todas estas gentes Dios Nuestro Señor dio cargo a uno que fue llamado San Pedro, para que de todos los hombres del mundo fuese señor y superior, a quien todos obedeciesen y fuese cabeza de linaje humano, donde quiera que los hombres viviesen y estuviesen, y en cualquier ley, secta o creencia, y dióle a todo el mundo por su señorío y jurisdicción y como quiera que le mandó pusiese su silla en Roma como el lugar más aparejado para regir el mundo, también le permitió que pudiese estar y poner su silla en cualquier otra parte del mundo, y juzgar, y gobernar a toda la gente, cristianos, moros, judíos, gentiles y de cualquier otra secta o creencia, a este llamaron Papa, que significa admirable, mayor, padre y guardador. A este San Pedro obedecieron y tomaron por señor, Rey y superior del universo, los que en aquel tiempo vivían y asimismo han tenido todos los otros que después de él fueron al pontificado elegido y así se ha continuado hasta ahora y así se continuará hasta que el mundo se acabe. Uno de los pontífices pasados que en lugar de este mundo hizo donación de estas Islas y tierras firmes del Mar Océano, a los ricos Rey y Reinas y a los sucesores en estos reinos, con todo lo que en ellas hay según se contienen en ciertas escrituras que sobre ellos basaron, así que sus Altezas son Reyes y Señores de estas Islas y tierras firmes, por virtud de dicha donación y como a tales Reyes y Señores algunas Islas más y casi todas a quienes esto ha sido modificado has recibido a sus altezas y les han obedecido y servido y sirven como súbditos lo deben hacer, con buena voluntad y sin ninguna resistencia […]\n\nFragmento 2: Por ende, como mejor puedo os ruego y requiero que entendáis bien lo que he dicho, y toméis para entenderlo y deliberar sobre ello el tiempo que fuere justo y reconozcáis a la Iglesia por Señora y Superiora del universo mundo y al sumo pontífice llamado Papa en su nombre y al Rey y la Reina nuestros señores en su lugar como Superiores y Señores y Reyes de esta isla y tierra firme por virtud de la dicha donación y consintáis en ese lugar a que estos padres religiosos o declaren los susodichos. Si así lo hicieres haréis bien y aquello que sois tenidos y obligados, y su Majestad y yo en su nombre os recibirán con todo amor y caridad, os dejarán vuestras mujeres hijos y haciendas libres, sin servidumbre, para que de ellas y vosotros hagáis libremente lo que quisiereis y por bien estuvieres y no os compelerán a que os tornéis cristianos, salvo si vosotros informados de la verdad quisiereis convertir a la religión católica como lo han hecho casi todos los vecinos de estas islas y además de esto Su Majestad os dará muchos privilegios y excepciones y os hará muchas mercedes.\n\nFragmento 3: [si no os sometiesen a la Iglesia y al Rey] o en ello dilación maliciosamente pusiereis, os certifico que con la ayuda de Dios yo entraré poderosamente contra vosotros y os haré guerra por todas las partes y maneras que yo pudiere y os sujetaré al yugo y obediencia de la Iglesia y de Su Majestad y tomaré vuestras mujeres e hijos y los haré esclavos y como tales los venderé y dispondré de ellos como Su Majestad mandare, y os tomaré vuestros bienes, y os haré todos los males y daños que pudiere como a vasallos que no obedecen y que no quieren recibir a sus señor y le resisten y le contradicen y protesto que las muertes y daños que de ella se recrecieren sean a vuestra culpa y no de Su Majestad ni mía, ni de estos caballeros que conmigo vinieron y de cómo os los digo, pido al presente Escribano que me lo de como testimonio firmado y a los presentes ruego que de ello sean testigo\". Nota: El texto del Requerimiento desapareció formalmente en 1542, cuando se promulgaron las Nuevas Leyes de Indias, y a través de unas ordenanzas en 1573 se sustituyó por una invitación a someterse, explicándole las ventajas que obtendría de ponerse bajo la tutela de la Iglesia y de los Reyes de España; incluso se cambiaron los términos, ya no se hablaba de conquistar, sino de pacificar.\n£\nGarcía Luaces, P. (2011, 14 de enero). 1514: Real Cédula que permite el matrimonio mixto, un hecho que destroza la Leyenda Negra. Libertad Digital. https://www.libertaddigital.com/cultura/historia/almanaque-de-la-historia-de-espana/1514-real-cedula-que-permite-el-matrimonio-mixto-un-hecho-que-destroza-la-leyenda-negra-8880/\n[Libertad Digital fue fundado por Federico Jiménez Losantos, una de las figuras más conocidas y polémicas de la derecha mediática española. Libertad Digital nació en el año 2000 alrededor de un grupo de intelectuales y periodistas vinculados a la revista La Ilustración Liberal. El propio grupo se define como impulsor de un discurso liberal alternativo al que consideraba dominante en los medios españoles. Por otro lado, García Luaces ha sido colaborador de la sección de divulgación histórica 'Almanaque de la Historia de España' del portal Libertad Digital durante la década de 2010. No consta en ningún lado que se trate de historiador profesional].\n\"El 14 de enero de 1514 se permitía, mediante Real Cédula, el matrimonio entre españoles e indias, una ley que confirmaba el carácter igualitario que los Reyes Católicos trataron de darle siempre a la conquista y que tantas veces ha sido distorsionado por la Leyenda Negra. Para los Reyes Católicos los territorios americanos eran una parte del reino de Castilla, y en un principio trataron de extender la estructura legal de Castilla a las Indias. Nunca se habló de colonias o factorías, sino que tuvieron un estatus similar al de las Islas Canarias y era expresa la prohibición de que fueran enajenadas. La lejanía y las diferencias sociales del Nuevo Mundo aconsejaron diseñar leyes propias, similares a las castellanas y nunca contradictorias. «Para que los indios amen nuestra religión, se les trate muy bien y amorosamente, se le darán graciosamente algunas cosas de mercaderías de rescate nuestras: i el almirante castigue mucho a quien les trate mal», le decía la Reina Católica a Colón al partir en su segundo viaje. Aun así, Colón trajo indios con los que quiso mercadear para obtener rápido beneficio, pero la Reina anuló la venta y los envió libres a sus tierras. El 20 de junio de 1500 la Reina prohibía, mediante Real Cédula, traer indios a España o someterlos a servidumbre. Las Leyes de Indias fueron de inspiración isabelina y tuvieron como fin supremo la libertad y dignidad del indígena. La Reina ordenaba ya en 1503 al gobernador Nicolás Ovando propiciar los matrimonios mixtos, «que son legítimos y recomendables porque los indios son vasallos libres de la corona española». Como consecuencia directa de estos matrimonios mixtos, los cargos en la administración indiana debían tener preferencia para los criollos, hijos de españoles y americanos.\"\n£\nMichele de Cuneo (1448-1503).\nCarta-relación a Jerónimo Annari, 28 de octubre de 1495. [Fuente extractada de J. Gil y C. Varela, \"Cartas de particulares a Colón y relaciones coetáneas\", p. 242]\nMientras estaba en la barca, capturé una mujer caribe muy hermosa, que el señor Almirante me regaló; y después de haberla llevado a mi camarote, estando desnuda según su costumbre, sentí deseos de disfrutar de su belleza. Ella no quería y me trató con sus uñas de tal manera que hubiera preferido no haber empezado. Pero yo tomé una cuerda y le di de azotes, tras los cuales lanzó gritos tan terribles que no podrías creer tus oídos. Finalmente llegamos a tal acuerdo que puedo decirte que parecía haber sido criada en una escuela de prostitutas.\n£\nBartolomé de las Casas (1448-1566). Fragmento de \"Brevísima destrucción de la Indias, 1552\"\nUn mal cristiano, tomando por fuerza una doncella para pecar con ella, arremetió la madre para se la quitar; saca un puñal o espada y córtale una mano a la madre; y a la doncella porque no quiso consentir, matóla a puñaladas.\n£\nPedro Cieza de León (1512-1554). Fragmentos de \"Descubrimiento y conquista del Perú, 1553*\" y de \"Crónica del Perú, 1554**\".\nFragmento 1*: Porque la principal causa porque [los españoles] fueron aborrecidos [por los indios] fue por ver cuán en poco los tenían y cómo usaban con sus mujeres e hijas sin ninguna vergüenza.\nFragmento 2**:  E las mujeres de los señores e las indias hermosas eran llevadas en cadena para tenerlas por mancebas, e si sus maridos quejándose las pedían los mataban, o les daban golpes con palos o con los pomos de las espadas.\nFragmento 3***: Los indios comenzaron a entender las importunidades de los españoles y la gran codicia que tenían y la prisa con que les pedían oro y plata y mujeres hermosas.\n£\nGonzález Fernández de Oviedo (1478-1557). Fragmento de \"Conquista de Florida. Historia general y natural de las Indias, Parte I, Libro XVII, capítulo 22, p. 172.\"\nE que las mujeres las querían también para se servir de ellas e para sus sucios usos e lujuria, e que las hacían bautizar para sus carnalidades más que para enseñarles la fe.\n£\nMartín González (1516- ¿1600?) [Fue un clérigo español que formó parte de la expedición de Álvar Núñez Cabeza de Vaca, con quien pasó por las Cataratas de Yguazú y llegó a Asunción, en 1542]. Fragmento de \"Cartas de Indias, 1556\".\n\"Después que prendieron a Cabeza de Vaca, le han quitado por fuerza los españoles a los naturales más de cien mil mujeres e hijas. Y cuando yo salí de allá quedarían vivas bien las cuarenta mil de ellas y las demás han muerto con los malos tratamientos que les han hecho los españoles. Que las pringan y queman con tizones, atando los pies y manos, las meten hierros ardiendo y les hacen otros géneros de crueldades que no es lícito declararlas. Y a otras con muchos azotes y palos que les dan hasta ponerles las carnes muy negras, con salmuera las lavan y les echan ventosas, y se las sajan para sacarles aquella sangre molida. Otras tienen colgadas de los pies y las dan humo a narices. Otras descalabran de tal manera que mueren, a otras les dan estando preñadas porque se han empreñado de otros españoles o mestizos o indios, y les matan las criaturas en el cuerpo y muchas de ellas mueren.\"\n£\nSuárez, M. (2021, 12 de octubre). Abascal: \"Qué orgullo sentirnos herederos de quienes descubrieron el nuevo mundo\". Publicado por el portal español de noticias \"Qué!\". Recuperado el 14 de junio de 2026, de https://www.que.es/2021/10/12/abascal-orgullo-herederos-descubrieron-nuevo-mundo/\nEl presidente de Vox, Santiago Abascal, ha reivindicado el Día de la Hispanidad, que se celebra este martes 12 de octubre: \"Qué orgullo sentirnos herederos de quienes descubrieron el nuevo mundo\". Asimismo, Abascal se ha mostrado orgulloso de ser herederos de \"aquellos que pusieron fin al genocidio de los pueblos indios, de aquellos que inventaron el Imperio de los Derechos Humanos, de aquellos que dieron al mundo la mayor obra de hermandad universal que haya aportado     "texto": "Matthew Restall (1964 -   ) [Etnohistoriador y académico británico, profesor de Historia de América Latina y antropología]\nFragmento de su libro \"Los siete mitos de la conquista española (2003)\"\nCon un ahínco comparable, los españoles buscaban también poblaciones indígenas en los territorios conquistados. Un aspecto de este complejo proceso era la necesidad de adquirir aliados indígenas, [algo clave en el] procedimiento de conquista. Esta estrategia era necesaria porque las expediciones españolas siempre eran menos numerosas que los pueblos autóctonos de las regiones que invadían, y porque los españoles solían desconocer por completo aquellos pueblos y territorios. Los aliados eran fuentes potenciales de información sumamente valiosa. Aportaban también un apoyo esencial en el transporte de las provisiones. Ante todo, los aliados indígenas ofrecían ayuda militar; por una parte, compensaban el potencial desequilibrio numérico de las fuerzas durante la batalla, y por otra permitían a los españoles la aplicación de la clásica estrategia de divide y vencerás. Este procedimiento no era en absoluto una estrategia excepcional ni original de Cortés o Pizarro; todos los conquistadores se procuraban el mayor número posible de aliados indígenas, y con la máxima celeridad que permitían las circunstancias.\n£\nGaillemin, B. (2020, 22 de mayo). Fragmentos de \"Recordando la masacre de Toxcatl: El principio del fin de la supremacía azteca\". Getty News. https://www.getty.edu/news/remembering-the-toxcatl-massacre-the-beginning-of-the-end-of-aztec-supremacy\nFragmento 1: En mayo de 2020 se cumplen 500 años desde la masacre de Toxcatl, en la que indígenas fueron asesinados durante un festival que tuvo lugar en la capital azteca de Tenochtitlán (la actual Ciudad de México).\nExisten dos historias en competencia sobre este evento. En la versión española, los conquistadores actuaron en defensa propia, pero en la versión indígena surge una narrativa muy diferente. El 22 de mayo de 1520, conquistadores españoles y sus aliados indígenas atacaron a los mexicanos—el grupo étnico de habla náhuatl que dominaba un vasto territorio multiétnico que se abarcaba desde el océano Pacífico hasta la costa del Golfo, y desde el centro de México hasta la actual Guatemala. El ataque durante el festival Toxcatl incitó una guerra que llevó al fin de la supremacía mexica y al inicio de la conquista de México. [...] El libro 12 de la enciclopedia náhuatl-española del siglo XVI, conocida como el Códice Florentino, conserva el punto de vista de los mexicas. Es el relato histórico más largo y detallado de la conquista escrito en náhuatl, la lengua franca del centro prehispánico de México. Aquí la Masacre Toxcatl se describe como un ataque llevado a cabo con crueldad, sigilo y traición. Los autores nahuas escriben que los españoles ordenaron que la ceremonia se celebrara, incluso después de detener al gobernante mexica, Moteuczoma Xocoyotzin, y saquear el palacio para obtener oro.\nLa imagen representa el ataque espantoso: españoles armados se agolpan desde todos los lados y atacan a mexicanos desarmados reunidos para la ceremonia. Al fondo se encuentra el Templo Mayor, el principal templo ceremonial de Tenochtitlan, señalando el entorno sagrado en el que se perpetró esta masacre. Dos tambores tradicionales en primer plano, el huehuetl vertical y el teponaztli horizontal, subrayan la violenta interrupción de la festividad religiosa. El texto náhuatl del Libro 12 y de otras fuentes náhuatl del siglo XVI, como el Códice Aubin, detallan cómo los españoles iniciaron el ataque cortando las manos del tambor y luego desmembrándolo, un recuerdo traumático también capturado en múltiples imágenes del manuscrito. [...]\n[IMG:imagenes/toxcatl_1.jpg]\nFragmento 2: El texto náhuatl del Libro 12 [del Códice Florentino] relata la escena sangrienta: Luego apuñalaron a todos con lanzas de hierro y los golpearon con espadas de hierro. Clavaron algunas en el vientre, y luego sus entrañas salieron desbordándose. Partieron la cabeza de algunos, realmente les cortaron el cráneo en pedazos, sus cráneos quedaron absolutamente pulverizados. Y a otras les daban golpes en los hombros; sus cuerpos se abrieron y desgarraron. Algunos los cortaban en las pantorrillas, otros en los muslos, otros en el vientre, y entonces todas sus entrañas se derramaban. Y había algunos que seguían huyendo en vano: arrastraban sus intestinos y parecían quedarse atrapados en ellos. Ansiosos por ponerse a salvo, no encontraron a dónde ir.  Pronto, los mexicanos organizan un contraataque. Los autores nahuas registran un discurso llamando a los guerreros a tomar las armas: \"¡Mexicas! ¡Guerreros! Ven corriendo, equipate con dispositivos, escudos y flechas. ¡Date prisa! ¡Ven corriendo! Los guerreros están muriendo; han muerto, perecido, han sido aniquilados. ¡Mexica! ¡Guerreros!\". El capítulo sobre la Masacre Toxcatl termina con los mexicas defendiéndose de los atacantes, en una atmósfera descrita como \"amarillenta\" (cozpol). El color amarillo se refiere al desenfoque de flechas, arpones y dardos, todos hechos de juncos, que caen sobre los atacantes. Los mexicanos ganan esta batalla, pero perderán la guerra que sigue. La historia termina con la rendición de los mexicanos, liderados por Cuauhtémoc, el último gobernante de Tenochtitlan.\n[IMG:imagenes/toxcatl_2.jpg]\n£\nFray Toribio de Benavente, más conocido como Fray Motolinía (1487? - 1569)\nFragmento de \"Historia de los indígenas de la Nueva España, 1541\"\nDios golpeó y castigó con diez terribles plagas esta tierra y a todos los que habitaban en ella, tanto nativos como extranjeros. La primera fue una plaga de viruela, y comenzó de esta manera. Cuando Hernando Cortés era capitán y gobernador, en el momento en que el capitán Pánfilo de Narváez desembarcó en este país, en uno de sus barcos había un negro afectado por viruela, una enfermedad que nunca se había visto aquí. En ese momento, la Nueva España estaba extremadamente llena de gente, y cuando la viruela comenzó a atacar a los indios, se convirtió en una peste tan grande entre ellos en toda la tierra que en la mayoría de las provincias murió más de la mitad de la población; en otros la proporción fue poco menor. Porque como los indios no conocían el remedio para la enfermedad y tenían la costumbre de bañarse con frecuencia, estuvieran bien o mal, y continuaban haciéndolo incluso cuando sufrían viruela, morían en montones, como chinches. Muchos otros murieron de hambre, porque, al enfermar todos a la vez, no podía cuidarse unos a otros, ni había nadie que les diera pan ni nada más. En muchos lugares ocurría que todos los habitantes de una casa morían y, como era imposible enterrar a la gran cantidad de muertos, derribaban las casas para contener el hedor que salía de los cuerpos y así que sus hogares se convirtieran en sus tumbas. Esta enfermedad fue llamada por los indios 'la gran lepra' porque las víctimas estaban tan cubiertas de pústulas que parecían leprosos. Incluso hoy en día se pueden ver evidencias evidentes de ello en algunos individuos que escaparon a la muerte, pues quedaron cubiertos de marcas de punzos.\n£\nFray Bernardino de Sahagún (c. 1499-1590)\nFragmentos de la \"Historia general de las cosas de la Nueva España, 1569)\nFragmento 1: En el año 1545 hubo una pestilencia grandísima y universal donde, en toda esta Nueva España, murió la mayor parte de la gente que en ella había. Yo me hallé en el tiempo de esta pestilencia en la ciudad de México, en la peste de Tlatilulco, y enterré más de diez mil cuerpos. Y al cabo de la pestilencia me dio a mí la enfermedad y estuve muy al cabo.\nFragmento 2: Que no ha de quedar hombre alguno sesenta años después que fuesen conquistados.\nFragmento 3: Paréceme que poco tiempo podrá preservar la Fe Católica en estas partes. Lo uno es porque las gentes se van acabando con gran prisa, no tanto por los malos tratamientos que se les hace como por las pestilencias que Dios les envía.\n£\nFray Diego de Durán (1537-1588)\nFragmento de \"Historia de las Indias de Nueva-España y islas de Tierra Firme, Volumen II, capítulo 1, p. 14, (escrita entre 1579–1581, pero publicada recién en 1867–1880)\n¡Cuán espantoso y de gran admiración fue el número de gente que en ella se halló, como al principio vieron los que antes de aquella gran mortandad que ahora hará treinta y tres años hubo, donde murió tanto número de gente que no quedó la tercera parte de los indios que en la tierra había!"

let indiceActual = 0;
let visibles = [];       // índices de fuentes actualmente visibles
let terminoBusqueda = '';

// ── Construir grilla ──
const grilla = document.getElementById('grilla');
FUENTES.forEach((f, idx) => {
  const card = document.createElement('div');
  card.className = 'fuente-card';
  card.dataset.idx = idx;
  card.innerHTML = `
    <span class="num">${f.num}</span>
    <span class="f-label">Fuente</span>
    <div class="tooltip">${f.titulo}</div>`;
  card.addEventListener('click', () => abrirModal(idx));
  grilla.appendChild(card);
});

// ── Buscador ──
const buscador = document.getElementById('buscador');
const contador = document.getElementById('contador');
const sinResultados = document.getElementById('sinResultados');

buscador.addEventListener('input', () => {
  terminoBusqueda = buscador.value.trim().toLowerCase();
  filtrar();
});

function filtrar() {
  const cards = grilla.querySelectorAll('.fuente-card');
  visibles = [];
  cards.forEach((card, idx) => {
    const f = FUENTES[idx];
    const hayCoincidencia = !terminoBusqueda ||
      f.texto.toLowerCase().includes(terminoBusqueda) ||
      f.titulo.toLowerCase().includes(terminoBusqueda);
    card.classList.toggle('oculta', !hayCoincidencia);
    card.classList.remove('destacada');
    if (hayCoincidencia) visibles.push(idx);
  });
  const n = visibles.length;
  contador.textContent = terminoBusqueda
    ? `${n} fuente${n !== 1 ? 's' : ''} encontrada${n !== 1 ? 's' : ''}`
    : '19 fuentes';
  sinResultados.style.display = n === 0 ? 'block' : 'none';
}

// ── Modal ──
const overlay   = document.getElementById('modalOverlay');
const mNum      = document.getElementById('mNum');
const mTitulo   = document.getElementById('mTitulo');
const mCuerpo   = document.getElementById('mCuerpo');
const mPos      = document.getElementById('mPos');
const btnAnt    = document.getElementById('btnAnterior');
const btnSig    = document.getElementById('btnSiguiente');

function abrirModal(idx) {
  indiceActual = idx;
  renderModal();
  overlay.classList.add('activo');
  document.body.style.overflow = 'hidden';
}

function cerrarModal() {
  overlay.classList.remove('activo');
  document.body.style.overflow = '';
  grilla.querySelectorAll('.fuente-card').forEach(c => c.classList.remove('destacada'));
}

function resaltarTexto(texto, termino) {
  if (!termino) return texto;
  const re = new RegExp(`(${termino.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
  return texto.replace(re, '<mark class="resaltado">$1</mark>');
}

function renderModal() {
  const f = FUENTES[indiceActual];
  mNum.textContent = `FUENTE ${f.num}`;
  mTitulo.textContent = f.titulo;

  // Texto con resaltado de búsqueda
  const textoResaltado = resaltarTexto(
    f.texto.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'),
    terminoBusqueda
  );
  const textoConImagenes = textoResaltado.replace(/\[IMG:([^\]]+)\]/g, '<img src="$1" alt="Imagen del Códice Florentino" style="max-width:100%;margin:1rem 0;display:block;border-radius:4px;">');
  const textoFinal = textoConImagenes.replace(/£/g, '<hr style="border:none;border-top:1px solid var(--gold);margin:1.5rem 0;">');
  mCuerpo.innerHTML = textoFinal;
  mCuerpo.scrollTop = 0;

  // Posición dentro de visibles
  const posEnVisibles = visibles.indexOf(indiceActual);
  const total = visibles.length || FUENTES.length;
  const pos   = posEnVisibles >= 0 ? posEnVisibles + 1 : '—';
  mPos.textContent = `${pos} / ${total}`;

  btnAnt.disabled = posEnVisibles <= 0;
  btnSig.disabled = posEnVisibles < 0 || posEnVisibles >= visibles.length - 1;

  // Marcar card
  grilla.querySelectorAll('.fuente-card').forEach(c => c.classList.remove('destacada'));
  const cardActiva = grilla.querySelector(`.fuente-card[data-idx="${indiceActual}"]`);
  if (cardActiva) cardActiva.classList.add('destacada');
}

btnAnt.addEventListener('click', () => {
  const pos = visibles.indexOf(indiceActual);
  if (pos > 0) { indiceActual = visibles[pos - 1]; renderModal(); }
});
btnSig.addEventListener('click', () => {
  const pos = visibles.indexOf(indiceActual);
  if (pos >= 0 && pos < visibles.length - 1) { indiceActual = visibles[pos + 1]; renderModal(); }
});

document.getElementById('btnCerrar').addEventListener('click', cerrarModal);
overlay.addEventListener('click', e => { if (e.target === overlay) cerrarModal(); });
document.addEventListener('keydown', e => {
  if (!overlay.classList.contains('activo')) return;
  if (e.key === 'Escape') cerrarModal();
  if (e.key === 'ArrowRight' && !btnSig.disabled) btnSig.click();
  if (e.key === 'ArrowLeft'  && !btnAnt.disabled) btnAnt.click();
});

// Inicializar visibles con todas las fuentes
visibles = FUENTES.map((_, i) => i);
</script>
