      line-height: 1.4;
      padding: 0.5rem 0.8rem;
      border-radius: 6px;
      width: max-content;
      max-width: 220px;
      text-align: center;
      pointer-events: none;

      transition: opacity 0.18s ease;

    .modal-body {

<script>
const FUENTES = [
  {
    "num": 1,
    "titulo": "Bases y transformaciones del pensamiento moderno",
    "texto": "Texto de Pico della Mirandola (1463-1494)\nFragmento del \"Discurso sobre la dignidad del hombre, 1496\".\nSegundo Encuentro de Dios con el Hombre\n(Fragmento inconcluso)\nHombre: ¡Dios mío, te pido si sientes todavía misericordia por mí, que anules el libre albedrío que me diste!\nDios: ¿Cómo puedes rechazar el obsequio más grande que te he dado, el que te llevó a donde estás hoy?\nHombre: ¿Cómo le puedes llamar regalo a lo que se me impuso? Tengo libre albedrío, pero no por decisión propia, y estoy al borde del abismo por eso. ¡Jamás elegí poseerlo y tengo que seguir, aunque no me guste!\nDios: ¿Por qué quieres deshacerte de él?\nHombre: Porque el libre albedrío significa responsabilidad moral, y tal responsabilidad, me he dado cuenta, es más de lo que puedo soportar.\nDios: ¿Por qué te parece insoportable la responsabilidad moral?\nHombre: ¿Por qué? Porque parece que tú te exiliaste de tu propia creación. Y así no lo soporto.\nDios: Supongamos que te libero de la responsabilidad moral, ¿podrías soportar vivir así?\nHombre: No lo sé, creo que no.\nDios: ¡Ah! Me lo imaginaba. Así que la responsabilidad moral no es lo único que objetas al libre albedrío ¿Qué otra cosa te molesta de él?\nHombre: Mientras tenga libre albedrío seré capaz de seguir pecando ¡y ya no quiero pecar!\nDios: Entonces, si no quieres pecar, ¿por qué pecas?\nHombre: No lo sé, simplemente me dejo llevar y peco. Las tentaciones vienen y por más que lo intento no logro resistirlas.\nDios: Si en verdad no puedes resistirlas, entonces no estás pecando por voluntad propia y por tanto, al menos así lo pienso, no estás pecando en absoluto.\nHombre: ¡No, no! Sigo sintiendo que con que sólo lo procurara más intensamente podría evitar el pecado. Entiendo que la voluntad no tiene límite. Quién de todo corazón desea evitar el pecado, lo evita.\nDios: Pues tú sabrás. ¿Tratas de evitar el pecado tan fuertemente como puedes o no?\nHombre: Honradamente no lo sé. De momento siento que lo intento con todas mis fuerzas, pero retrospectivamente me preocupa que quizá no haya sido así.\nDios: En otras palabras, realmente no sabes si has estado pecando o no, de manera que es posible que no hayas pecado en absoluto.\nHombre: Claro que eso es posible, pero tal vez sí haya yo pecado. Y eso es lo que me da tanto miedo.\nDios: ¿Por qué te da miedo pensar que has pecado?\nHombre: No sé por qué, por una parte, tienes fama de que administras castigos bastante desagradables en la otra vida.\nDios: ¡Así que eso es lo que te molesta! ¿Por qué no lo dijiste desde el principio en vez de incurrir en toda esa charla periférica sobre el libre albedrío y la responsabilidad? ¿Por qué no te limitaste a pedirme que no te castigara por tus pecados?\nHombre: Me considero lo bastante realista como para saber que difícilmente me concederías tal petición.\nDios: ¿A poco? ¿Así que tú tienes un concepto realista de cuáles peticiones concedo, eh? Bueno, te diré qué voy a hacer. Te concederé una dispensa muy, muy especial para que peques cuanto quieras y te daré mi palabra divina de honor de que nunca te castigaré por ello en lo más mínimo ¿De acuerdo?\nHombre: ¡No, no, no, no hagas eso!\n£\nSnyder, Sharon L. [Profesora adjunta del programa interdisciplinario de doctorado en estudios sobre discapacidad de la Universidad de Illinois en Chicago. También imparte clases de cine y literatura en la Universidad del Norte de Michigan]\nFragmento sobre la entrada «modernidad» de la Enciclopedia Británica (16 de abril de 2026) https://www.britannica.com/topic/modernity. Consultado el 12 de junio de 2026.\nLa modernidad, la autodefinición de una generación respecto a su propia innovación tecnológica, gobernanza y socioeconomía. Participar en la modernidad implicaba concebir la propia sociedad como inmersa en avances organizativos y del conocimiento que hacían que los predecesores inmediatos parecieran anticuados o, al menos, superados.[...] Más concretamente, la modernidad se asoció con la subjetividad individual, la explicación y racionalización científicas, el declive de las cosmovisiones religiosas, el surgimiento de la burocracia, la rápida urbanización, el auge de los estados-nación y la aceleración del intercambio financiero y la comunicación.[...] La modernidad en Occidente durante la primera mitad del siglo XX significó nuevos formatos para nuevas ideas: formas innovadoras de escribir y pensar, nuevos campos de investigación, la incorporación de mujeres a ámbitos laborales históricamente dominados por hombres, el surgimiento de nuevas formas artísticas (por ejemplo, el jazz y el cine mudo) y el desarrollo de nuevos productos y tecnologías. Muchos estudiosos de la modernidad coinciden en que los métodos científicos sirven para marcar claramente la ruptura entre lo moderno y lo antiguo, ya que los diseños de investigación permiten precisamente nuevos medios para comprobar la realidad: desde telescopios y microscopios electrónicos hasta informes clínicos, encuestas, pesas y balanzas, además de sistemas para el análisis de datos. Los ciudadanos de la modernidad eran conscientes de cómo el desarrollo científico, junto con las mejoras materiales en el nivel de vida, se traducía en medios de destrucción y control de la población.\n£\nNorman J. G. Pounds (1912-2006) [Historiador y geógrafo inglés que escribió sobre la cultura material de la Europa preindustrial]\nFragmento de su libro \"La vida cotidiana: historia de la cultura material, 1989\"\nLa cultura popular anterior al Concilio de Trento (1545-1563), con sus infinitos matices de color local [en Europa], se vio al final sustituida por una cultura de masas, ampliamente uniforme y que cubría grandes áreas. El vehículo principal de la cultura de masas que comenzó a penetrar en la sociedad rural, después de haber estado presente durante generaciones en la urbana, fue la palabra impresa. La sociedad no se alfabetizó de la noche a la mañana, sino que ya había existido una pequeña minoría que sabía leer textos sencillos, mientras que, de hecho, las iglesias habían promovido la alfabetización al poner al alcance de las gentes catecismos, obras litúrgicas e incluso la Biblia impresos en lengua vernácula. A fines del siglo XVII, la impresión y la publicación de obras se disparó. El testimonio proporcionado por testamentos y escrituras demuestra que cada vez era mayor la proporción de individuos de la Europa central y occidental que sabían firmar con su propio nombre y, presumiblemente, leer.\n£\nHernán Miguel (Físico y doctor en filosofía argentino, especializado en epistemología y filosofía de la ciencia y titular desde hace más de veinte años de una cátedra de Introducción al Pensamiento Científico, materia dictada por el CBC de la UBA)\nFragmento del material de estudio de la cursada virtual del año 2021\nHay un momento de la historia en que [la imagen de la ciencia antigua] se quiebra, en consonancia con una serie de cambios que experimenta Europa luego del fin de la Edad Media en el siglo XV y en los dos siglos posteriores. El Renacimiento no implicó sólo una nueva estética, [dado que también implicó] un cambio respecto del estudio de la naturaleza. [...] El punto de partida de la ciencia moderna [...] radica, igual que en el caso de la ciencia antigua, en la observación que provoca curiosidad y suscita preguntas a la mente científica. Para dar cuenta de estas observaciones, sin embargo, a diferencia de la ciencia antigua, se proponen hipótesis provisorias que son puestas a prueba a la luz de las observaciones. [...] Otro rasgo distintivo de la ciencia moderna es su búsqueda de la utilidad práctica, lo cual posibilitó el desarrollo tecnológico. La ciencia antigua no tenía esto como objetivo principal, y sólo de modo esporádico desarrollaba alguna técnica útil. Sin embargo, la ciencia moderna dio origen a las sucesivas Revoluciones Industriales e impactó de modo clave en la vida moderna."
  },
  {
    "num": 2,
    "titulo": "Diversidad cultural y geográfica en la América antigua",
    "texto": "Susana Frank (Profesora nacional de Pintura, museóloga y directora adjunta del Instituto de Cultura Indígena Argentino).\nFragmento de su obra \"Pueblos originarios de América, introducción\" [Publicado por Ediciones del Sol en su colección \"Por la senda de los Pueblos Originarios\", Buenos Aires, 2008].\nPara el año 2000 a.C. se encontraban definidas las áreas culturales del continente. En cada una de ellas existían ya realidades socio-culturales concretamente integradas y adaptadas a su medio, especialmente en Mesoamérica y en los Andes centrales, donde se desarrollaron las civilizaciones más avanzadas. [...] El término Mesoamérica -que no es lo mismo que Centroamérica- fue utilizado por los investigadores para designar el contexto cultural, histórico y geográfico en donde se desarrollaron las altas culturas que describiremos más adelante. Sus límites pasan, por el norte, por sobre la capital de México, y por el sur, por Honduras y Nicaragua. En esta área se desarrolló un patrón de civilización que hizo que las culturas que la habitaron compartieran una serie de rasgos básicos. [Por otro lado] en el área central de los Andes, numerosos pueblos desarrollaron complejas técnicas de irrigación, cultivo y pesca, aprovechando la variedad de condiciones climáticas que se daban desde los oasis costeros a los valles andinos. Construyendo templos colosales, centros ceremoniales, complejos urbanísticos, fortalezas y palacios, trabajando con maestría las piedras y el adobe, además de crear maravillosas obras de arte en cerámica, telas, metales y piedra.\n£\nFrancisco López de Gomara (1510-1564). Fragmentos de \"Historia de la conquista de México, 1552\". CAPÍTULO LXV: CÓMO SALIÓ MOTECZUMA A RECIBIR A CORTÉS\nFragmento 1: De Iztacpalapan a México hay dos leguas por una calzada muy ancha, que holgadamente van ocho caballos por ella a la par, y tan derecha como hecha por nivel, y quien buena vista tenía, alcanzaba a ver las puertas de México. A los lados de ella están Mexicalcinco, que es de cerca de cuatro mil casas, toda dentro en agua; Coyoacán, de seis mil, y Uicilopuchtli, de cinco. Tienen estas ciudades muchos templos, con tantas torres, que las hermosean, y gran trato de sal, porque allí la hacen y venden, o llevan fuera a ferias y mercados. Sacan agua de la laguna, que es salada, por arroyuelos a hoyos de tierra, y en ellos se cuaja; y así, hacen pelotas y panes de sal, y también la cuecen, y es mejor, pero más embarazosa; era gran renta para Moteczuma. En esta calzada hay, de trecho a trecho, puentes levadizos sobre los ojos por do corre la agua de la una laguna a la otra. Por esta calzada fue Cortés con sus cuatrocientos compañeros, y otros seis mil indios amigos, de los pueblos que atrás pacificó. Apenas podía andar, con la apretura de la mucha gente que a ver los españoles salía.\n\nFragmento 2: Llegó cerca de la ciudad, donde se junta otra calzada con ésta y donde está un baluarte fuerte y grande, de piedra, dos estados alto, con dos torres a los lados, y en medio un petril almenado y dos puertas; fuerza harto fuerte. Aquí salieron cuatro mil caballeros cortesanos a recibirle, vestidos ricamente a su usanza, y todos de una misma manera. Cada uno, como Cortés llegaba, tocaba su mano derecha en tierra, besábala, humillábase y pasaba delante por la orden que venían. Tardaron una hora en esto, y fue cosa de mucho mirar. Desde el baluarte sigue todavía la calzada, y tiene, antes de entrar en la calle, una puente de madera levadiza y diez pasos ancha, por el ojo de la cual corre agua y entra de la una en la otra. Hasta esta puente salió Moteczuma a recibir a Cortés, debajo de un palio de pluma verde y oro, con mucha argentería colgando, que lo llevaban cuatro señores sobre sus cabezas. Traíanle de los brazos Cueltlauac y Cacama, sobrinos suyos y grandes príncipes. Venían todos tres a una manera riquísimamente ataviados, salvo que el señor traía unos zapatos de oro y piedras engastadas que solamente eran las suelas prendidas con correas, como se pintan a lo antiguo. Andaban criados suyos de dos en dos, poniendo y quitando mantas por el suelo, no pisase en la tierra. Seguían luego doscientos señores como en procesión, todos descalzos, y con ropas de otra más rica librea que los tres mil primeros. Moteczuma venía por medio de la calle, y éstos detrás y arrimados cuanto podían a las paredes, los ojos en tierra, por no mirarle a la cara, que es desacato.\n£\nBartolomé de las Casas (1484-1566)\nFragmento de \"Brevísima relación de la destrucción de las Indias, 1552\".\nCapítulo 1: Descubrimiento de las Indias.\nFragmento 1: Descubriéronse las Indias en el año de mil e cuatrocientos y noventa y dos. Fuéronse a poblar el año siguiente de cristianos españoles, por manera que ha cuarenta e nueve años que fueron a ellas cantidad de españoles; e la primera tierra donde entraron para hecho de poblar, fue la grande y felicísima isla Española, que tiene seiscientas leguas en torno. Hay otras muy grandes e infinitas islas alrededor, por todas las partes della, que todas estaban e las vimos las más pobladas e llenas de naturales gentes, indios dellas, que puede ser tierra poblada en el mundo [...] Todas estas universas e infinitas gentes a toto genero crió Dios los más simples, sin maldades ni dobleces, obedientísimas, fidelísimas a sus señores naturales e a los cristianos a quien sirven; más humildes, más pacientes, más pacíficas e quietas, sin rencillas ni bollicios, no rijosos, no querulosos, sin rancores, sin odios, sin desear venganzas, que hay en el mundo [...] Sus vestidos comúnmente son en cueros, cubiertas sus vergüenzas, e cuando mucho cúbrense con una manta de algodón, que será como vara y media o dos varas de lienzo en cuadra. Sus camas son encima de una estera e, cuando mucho, duermen en unas como redes colgadas, que en lengua de la isla Española llamaban hamacas. Son eso mesmo de limpios e desocupados e vivos entendimientos, muy capaces e dóciles para toda buena doctrina, aptísimos para recebír nuestra sancta fe católica, e ser dotados de virtuosas costumbres [...]\n\nFragmento 2: En estas ovejas mansas, y de las calidades susodichas por su Hacedor y Criador así dotadas, entraron los españoles desde luego que las conocieron como lobos e tigres y leones cruelísimos de muchos días hambrientos. Y otra cosa no han hecho de cuarenta años a esta parte, hasta hoy, e hoy en este día lo hacen, sino despedazallas, matallas, angustiallas, afligillas, atormentallas y destruillas por las estrañas y nuevas e varias e nunca otras tales vistas ni leídas ni oídas maneras de crueldad, de las cuales algunas pocas abajo se dirán, en tanto grado, que habiendo en la isla Española sobre tres cuentos de ánimas [alrededor de tres millones de personas] que vimos, no hay hoy de los naturales della docientas personas [...] La causa por que han muerto y destruido tantas y tales e tan infinito número de ánimas los cristianos, ha sido solamente por tener por su fin último el oro y henchirse de riquezas en muy breves días, e subir a estados muy altos e sin proporción de sus personas; conviene a saber, por la insaciable cudicia e ambición que han tenido, que ha sido mayor que en el mundo ser pudo, por ser aquellas tierras tan felices e tan ricas, e las gentes tan humildes, tan pacientes y tan fáciles a subjectarlas; a las cuales no han tenido más respecto ni dellas han hecho más cuenta ni estima (hablo con verdad por lo que sé y he visto todo el dicho tiempo), no digo que de bestias (porque pluguiera a Dios que como a bestias las hobieran tractado y estimado), pero como y menos que estiércol de las plazas."

    "num": 3,
    "titulo": "Poder y jerarquía en la confederación mexica",
    "texto": "Fray Bernardino de Sahagún (1499-1590)\nFragmento de \"Historia General de las cosas de Nueva España, 1577\"\nLIBRO QUINTO, CAPITULO X. De los pasatiempos y recreaciones de los señores.\nCuando los señores salían de su casa y se iban a recrear, llevaban una cañita en la mano y movíanla al compás de lo que iban hablando con los principales. Los principales iban de una parte y de otra del señor, llevábanle en medio e iban algunos delante apartando la gente, que nadie pasase delante de él, ni cerca de él; y nadie de los que pasaban por el camino osaba mirarle a la cara, sino luego bajaban la cabeza y echaban por otra parte. Algunas veces, por su pasatiempo, el señor cantaba y aprendía los cantares que suelen decir en los areitos. Otras veces por darle recreación algún truhán le decía truhanerías, o gracias. Otras veces por su pasatiempo jugaba a la pelota, y para esto teníanle sus pelotas de ulli guardadas; estas pelotas eran tamañas como unas grandes bolas de jugar a los bolos (y) eran macizas, de una cierta resina o goma que se llamaba ulli, que es muy liviana y salta como pelota de viento, y tenía de ellas cargo algún paje; y también traía consigo buenos jugadores de pelota que jugaban en su presencia, y por el (bando) contrario otros principales, y ganábanse oro y chalchihuites y cuentas de oro y turquesas, y esclavos, y mantas ricas y maxtles ricos, y maizales y casas, y grebas de oro y ajorcas de oro y brazaletes hechos con plumas ricas, y pellones de pluma y cargas de cacao; el juego de la pelota se lamaba tlaxtli o tlachtli […].\n\nFragmento 2: LIBRO DÉCIMO, CAPITULO IV. Señor, rey, emperador, papa, obispo.\nLas excelencias del señor, rey o emperador, obispo o papa, pónense por vía de metáfora ceuallo, hecanhyo, quiere decir, cosa que hace sombra, porque el mayor ha de hacer sombra a sus súbditos; malacahyo, cosa que tiene gran circuito en hacer sombra, porque el mayor ha de amparar a todos, chicos y grandes. Póchotl es un árbol que hace gran sombra y tiene muchas ramas, ahuehuctl es de la misma manera, porque el señor ha de ser semejante a estos árboles, donde sus súbditos se amparen. El mayor ha de ser reverenciable, espantable, preciado y temido de todos. El mayor que hace bien su oficio ha de llevar a sus súbditos, unos a cuestas, otros en el regazo, otros en brazos, los ha de allegar y tener debajo sus alas, como las gallinas a los pollos.\n\nFragmento 3: CAPÍTULO V. De las personas nobles Hidalgo.\nEl hidalgo tiene padre y madre legítimos, y sale y corresponde a los suyos, en gesto y en obras; y entre los hijos hidalgos hay primogénito, unigénito, mayor, hijo segundo y tercero e hijo postrero; hay hijo hidalgo que tiene hermanos y hermanas, abuelos y abuelas, y hay hidalgos muy queridos, delicados y regalados y servidos. El buen hidalgo es obediente, imita a sus padres en sus costumbres y es recto y justo, pronto y alegre a todas las cosas, figura o traslado de sus antepasados. El mal hidalgo es alocado, torpe, mal acondicionado, desgraciado, perverso, infernal, deshonra y afrenta de su linaje [...] La persona noble, de buen linaje, siempre procura de tomar buenos ejemplos y sacar buenas costumbres de los buenos. La noble persona de buen natural es dócil, y remeda a los buenos, y es ejemplar, y tiene otras muchas propiedades muy buenas; y por el contrario los malos, que descienden de gente noble y de buen linaje, son soberbios, revoltosos e incapaces de bondad alguna.\n£\nDiego Durán (1537-1588)\nFragmento de \"Historia de las Indias de Nueva España e islas de Tierra Firme, 1576-1581\"\nOrdenóse que sólo el rey [Moctezuma II] y […] Tlacaélel [su principal consejero] pudiesen traer zapatos en la casa real y que ningún grande entrase calzado en palacio [...] y sólo ellos pudieran traer zapatos por la ciudad, y ningún otro, so pena de la vida, excepto los que hubiesen hecho alguna valentía en la guerra, a los cuales por su valor y señal de valientes les pudiesen permitir traer unas sandalias de las muy comunes y baladíes […] También se determinó que sólo el rey pudiese traer las mantas galanas de labores y pinturas de algodón e hilo de diversos colores y plumem [...] y los grandes señores, que eran hasta doce, las mantas de tal y tal hechura, y los de menos valía, como hubiesen hecho tal o tal valentía o hazaña, otras diferentes; los soldados, de otra menos labor y hechura [...] Toda la demás gente, so pena de la vida, salió determinado que ninguno usase de algodón ni se pusiese otras mantas sino de nequén, y questas mantas no pasasen más de cuanto cubriesen la rodilla, y si alguno la trujese que llegase a la garganta del pie, fuese muerto, salvo si no tuviese alguna señal en las piernas de herida que en la guerra le hubiesen dado; y así, cuando se topaban alguno que traía la manta más larga ... luego le miraban las piernas si tenía alguna señal de herida que en la guerra le hubieren dado, y no hallándosela le mataban, y si la tenía le dejaban y se la permitían para cubrir la herida que por valiente le habían dado en las piernas, y decían, que pues no huyó el pie a la espada, que era justo con aquélla la galardonease y fuesen aquellas piernas honradas.\n£\nVíctor M. Castillo Farreras (1932-2021) [Fue un historiador mexicano, de los especialistas más importantes de la escuela nahuatlista de la UNAM, que dedicó gran parte de su carrera al estudio de las fuentes nahuas, la organización económica y política mexica, el calendario indígena y la obra de cronistas indígenas como Chimalpahin]. Fragmentos del libro \"Estructura económica de la sociedad mexica según las fuentes documentales\", copia electrónica en:  https://historicas.unam.mx/publicaciones/publicadigital/libros/estructura/documentales.html\nFragmento 1: Por lo que respecta a los bienes inmuebles, se seguían los mismos lineamientos de posesión y uso de los muebles. En tal forma lo afirman Durán y Tezozómoc, al expresar que no se podían tener casas con almenados altos, ni con techos puntiagudos, ni con miradores elevados, a menos que sus propietarios fuesen personas reconocidas por su valentía en la guerra. Con lo antes dicho resulta evidente la supremacía social y económica de los miembros de la comunidad mexica que con mayor ahínco se dedicaban a la guerra. Las razones son por demás obvias: la guerra había sido el medio para la apropiación del territorio comunal y aún seguía siéndolo, sin posibilidades de solución por su misma estructura, para conservarlo y aun ampliarlo dado el caso. La guerra, en suma, resultaba una de las condiciones previas más importantes de la existencia del grupo como propietario del suelo.\n\nFragmento 2: Como mera ilustración relativa a la propiedad de inmuebles se transcribe en seguida la descripción que da el Códice Florentino para cinco tipos diferentes de casas, la cual indica a su vez la condición social de otros tantos poseedores de esta clase de bienes;\nTlatocacalli. E\" decir, la casa del tlatoani o de alguien estimado. Quiere decir que es buena, hermosa, preciosa, delicada casa.\nCalpixcalli. Era la casa de los calpixque, es decir, el lugar en donde se guardan los bienes del tlatoani o de la ciudad. Es muy grande, muy alta; es fuerte, recia, firme; es modelo, dechado. Es templada, abrigada, tiene calor. Esto quiere decir que allí están los bienes; la bebida y la comida allí mismo están.\nZazan ye calli. Casas comunes y corrientes. Quiere decir que no son muy buenas; casas de ninguna manera estimadas; son poca cosa, de burla, venidas a menos; nada se ve en el contorno del pequeño hogar de calor y de comodidad.\nIcnocalli. Casa de gente humilde. Quiere decir que no es casa presuntuosa sino casa de humildes o casa de pobres. Hogar de gente desamparada; quiere decir que es morada de gente miserable, popular, quizá humilde, quizá pobre.\nMacehualcalli. Casa de macehuales. Quiere decir que es casa de gente pobre. Es bajuela, estrecha, no aderezada. Allí no hay aire, es inacabada, no es propia para el hombre, es casa desamparada, en la miseria. Es de buenos cimientos de piedra, recia es su base. El contorno del pequeño hogar es destemplado; no tiene estacas en las paredes, no tiene ningún muro de resguardo, es casa muy desabrigada, es fría; el agua helada le va pasando, el agua va manando por todas partes; el viento se arremolina, el viento pasa por todos lados. […]\nSe mira claro que en tanto que unos ocuparon edificios que fueron dechado por su funcionalidad y belleza, otros (los más), pudieron sólo habitar en casas, ya no digamos humildes, sino francamente inadecuadas para la vida del hombre; así se manifiesta al menos en la descripción de las rnacehualcalli.\n\nFragmento 3: Ya en el transcurso de este trabajo quedaron expresados el origen y consolidación de los pipiltin. Por lo que respecta a quiénes eran y qué funciones desempeñaban, creemos innecesario entrar a tales detalles; basta con tener en cuenta que fueron ellos los que ocuparon los principales puestos de la organización social, ya sea en la administración civil, en el ejército o en el sacerdocio; asimismo primordialmente en ellos se localizaba la posibilidad de propiedad privada de la tierra y de artículos especiales; y que no sólo estaban exentos del pago de tributos y del trabajo agrícola (como rutina obligada, por supuesto), sino que podían llegar a ser tributados y disfrutar del servicio de otra gente. Al tratar de los macehualtin y de otros grupos se harán referencias continuas a los pipiltin. Desde el punto de vista conceptual y religioso, macehualli es aquel que reconoce su origen en Dios, que hace penitencia, que se eleva a Dios; así entonces, macehualtin son todos, sean del estrato y del lugar que sean. Pero desde el punto de vista social y económico la cosa es distinta: todos los que no son pipiltin son macehualtin. No obstante, hubo excepciones a esto último, ya que a los pochtecas y a ciertos grupos de artesanos no se les consideró así, aunque tampoco [se los consideró como] pipiltin; y no se les estimó macehualtin no sólo -pero, sobre todo- por su situación económica, sino posiblemente por su origen étnico distinto. Siendo así, resulta más clara la división interna en dos sectores a partir de Acamapichtli: los que se unieron en parentesco a él [que pasaron a ser los] pipiltin, los que no [se le unieron en parentesco, que entonces quedaron siendo] macehualtin […]."

    "titulo": "Chinampas, dioses y sacrificios: el universo azteca",
    "texto": "José de Acosta (1540-1600)\nFragmento de su \"Historia natural y moral de las Indias (1590)\"\nLos que no han visto las sementeras que se hacen en la laguna de México, en medio de la misma agua, tendrán por patraña lo que aquí se cuenta o cuando mucho creerán que es encantamiento del demonio, a quien esta gente adoraba. Mas en realidad es cosa muy hacedora, y se ha hecho muchas veces hacer sementera movediza en el agua, porque sobre juncia y espadaña se echa tierra en tal forma que no se deshaga en el agua y allí se siembra y cultiva, y crece y madura y se lleva de una parte a otra.\n£\nFragmento del \"Códice Florentino, Libro XI, capítulo VIII, 1558\".\nEl maíz blanco es propio de los de las milpas de regadío, de los de las milpas de roza, de los de las chinampas, de los chaleas, de los huexotzincas, de los tlateputzcas, de los tlalhuicas, de los de Tonayan, de los matlatzincas, de los mazahuacas, de los michhuacas, de los totonacas, de los de Anáhuac. Es transparente, duro como coyol, consistente; es como cuesco, es de dos caras, acaracolado, blanco, cristalino. Es como cobre, como jade. es precioso. Es nuestro cuerpo, nuestra osamenta, es nuestro sustento.\n£\nFrancisco del Paso y Troncoso (1842–1916) [Fue un historiador, arqueólogo, filólogo y nahuatlato mexicano. Dedicó su vida al estudio de las civilizaciones prehispánicas y al rescate documental de la historia colonial de México].  Fragmento de su gran colección de documentos \"Papeles de Nueva España\".\n[...] tienen unos árboles que llaman magueyes, de los cuales tienen mucho aprovechamiento; hacen miel, como arrope de Castilla, hacen della vino, vinagre, beben el agua miel por cocer que es una bebida muy saludable, purgativa, que engorda y da salud; de las pencas y raíces hacen una comida a su modo, dulce; del zumo de las hojas se curan llagas y heridas, es una medicina que aprovecha mucho y se ha hecho gran experiencia dello; sacan dello nequén con que hacen las mantas, cuerdas y otras jarcias; sirven estas hojas de tablas a manera de tejas con que cubren sus casas para las aguas; sírvenles de canales y de leña; crían estos árboles, en las raíces dellos, unos gusanos que los naturales comen.\n£\nBernal Díaz del Castillo (1496-1584)\nFragmentos de su \"Historia verdadera de la conquista de la Nueva España\" (publicada en España en el año 1632, pero escrita por su autor entre los años 1568 y 1575, aproximadamente).\nFragmento 1: Volvamos a la provincia de Soconusco, que está entre Guatemala y Guaxaca. Digo que en el año de veinte y cinco estuve en ella de pasada ocho o diez días, y solía ser poblada de más de quince mil vecinos, y tenían sus casas y huertas y cacaguatales muy buenas, y toda la provincia hecha un vergel de árboles de cacaguatales, y era muy apacible; y agora, en este año de quinientos y sesenta y ocho, está tan fatigada y despoblada, que no hay en ella mil y docientos vecinos. Y preguntando que cómo se había despoblado y había tan pocos vecinos, me dijeron que los unos se murieron de pestilencia y otros porque no les dejan reposar los alcaldes mayores y corregidores y alguaciles que tienen, y de muchos clérigos y curas que les ponen los perlados, y ciertamente, hay tantos, que la mitad sobran.\n\nFragmento 2: Y corriendo la costa adelante, vimos una isleta que bañaba la mar y tenía la arena blanca y estará al parescer obra de tres leguas de tierra; y posímosle nombre isla Blanca, y ansí está en las cartas del marear [...] Y echados los bateles en el agua, fue el Juan de Grijalva, con muchos de nosotros los soldados, a ver la isleta, porque había humos en ella; y hallamos dos casas hechas de cal y canto bien labradas, y en cada casa unas gradas, por donde subían a unos como altares, y en aquellos altares tenían unos ídolos de malas figuras, que eran sus dioses. Y allí hallamos sacrificados, de aquella noche, cinco indios, y estaban abiertos por los pechos y cortados los brazos y los muslos, y las paredes de las casas llenas de sangre. De todo lo cual nos admiramos en gran manera, y pusimos nombre a esta isleta isla de Sacrificios, y ansí está en las cartas del marear.\n\nFragmento 3: Y cuando el Cacique Gordo las presentó, dijo a Cortés: \"Tecle (que quiere decir en su lengua señor), estas mujeres son para los capitanes que tienes, y esta, que es mi sobrina, es para ti, que es señora de pueblos y vasallos\". Cortés la rescibió con alegre semblante y les dijo que se lo tenían en merced, más para tomallas, como dice,  y que seamos hermanos, que hay necesidad que no tengan aquellos ídolos en que creen y adoran, que los traen engañados, y que no les sacrifiquen más ánimas [...] Y cada día sacrificaban delante de nosotros tres o cuatro o cinco indios, y los corazones ofrescían a sus ídolos, y la sangre pegaban por las paredes y cortábanles las piernas y los brazos y muslos, y lo comían como vaca que se trae de las carnecerías en nuestra tierra. Y aún tengo creído que lo vendían por menudo en los tianguez, que son mercados. Y que como estas maldades se quiten, y que no lo usen, que no solamente les seremos amigos, más que les hará que sean señores de otras provincias. Y todos los caciques, papas y principales respondieron que no les estaba bien dejar sus ídolos y sacrificios, y que aquellos sus dioses les daban salud y buenas sementeras y todo lo que habían menester [...]."

    "titulo": "Tawantinsuyo: el orden imperial de los Andes",
    "texto": "Inca Garcilaso de la Vega (1539-1616)\nFragmento de \"Comentarios Reales de los Incas (1609)\"\nEl Inca se sentava, de ordinario, en un asiento de oro macigo, que llaman tiana era de una tercia en alto, sin braceras ni espaldar, con algún cóncavo para el asiento; poníanla sobre un gran tablón cuadrado, de oro. Las vasijas de todo el servicio de la casa, assí de la mesa como de la botillería y cozina, chicas y grandes, todas eran de oro y plata, y las havía en cada casa de depósito, para cuando, el Rey caminasse, que no las llevavan de unas partes a otras, sino que cada casa de las del Inca, assí las que havía por los caminos reales como las que havía por las provincias, todas tenían lo necessario para cuando el Inca llegasse a ellas, caminando con su exército o visitando sus reinos. Havía también en estas casas reales muchos graneros y orones, que los indios llaman pirua, hechos de oro y plata, no para encerrar grano, sino para grandeza y majestad de la casa y del señor della. [sobre cómo eran las casas del inca] En muchas casas, o en todas, tenían baños con grandes tinajones de oro y plata, en que se lavavan, y caños de plata y oro, por los cuales venía el agua a los tinajones. Y donde havía fuentes de agua caliente natural, también tenían baños, hechos de gran majestad y riqueza [...] La mayor parte destas riquezas hundieron los indios, luego que vieron los españoles deseosos de oro y plata, y de tal manera la escondieron, que nunca más ha parecido ni se espera que parezca, si no es que se hallen acaso, porque se entiende que los indios que hoy viven no saben los sitios do quedaron aquellos tesoros, y que sus padres y abuelos no quisieron dexarles noticia dellos, porque las cosas que havían sido dedicadas para el servicio de sus Reyes no querían que sirviessen a otros. Todo lo que hemos dicho del tesoro y riquezas de los Incas lo refieren generalmente todos los historiadores del Perú, encareciéndolas cada uno conforme a la relación que dellas tuvo.\n£\nPedro Cieza de León (1512-1554)\nFragmentos de \"Segunda Parte de la Crónica del Perú (1550)\"\nFragmento 1: CAP. XVII.\n—Que trata la órden que tenian los Incas, y cómo en muchos lugares hacian de las tierras estériles fértiles, con el proveimiento que para ello daban.\nUna de las cosas de que más se tiene envidia á estos señores, es entender cuán bien supieron conquistar tan grandes tierras y ponellas, con su prudencia, en tanta razón como los españoles las hallaron, cuando por ellos fué descubierto este nuevo reyno [...] Siempre procuraron de hacer por bien las cosas y no por mal en el comienzo de los negocios; despues, algunos Incas hicieron grandes castigos en muchas partes; pero antes, todos afirman que fué grande la benevolencia y amicicia con que procuraban el atraer á su servicio estas gentes. Ellos salian del Cuzco con su gente y aparato de guerra y caminaban con gran concierto hasta cerca de donde habian de ir y querian conquistar, donde muy bastantemente se informaban del poder que tenian los enemigos y de las ayudas que podian tener y de qué parte les podrian venir favores, y por qué camino; [...] enviábales mensajeros propios, con los cuales les enviaba decir quel queria tenerlos por parientes y aliados, por tanto, que con buen ánimo y corazon alegre, saliesen á lo recebir y recibirlo en su provincia, para que en ella le sea dada la obediencia, como en las demás; y por que lo hagan con voluntad, enviaba presentes á los señores naturales. Y con esto, y con otras buenas maneras que tenian, entraron en muchas tierras sin guerra, en las cuales mandaba á la gente de guerra que con él iba, que no hiciesen daño ni injuria ninguna, ni robo, ni fuerza; y si en esta provincia no habia mantenimientos, mandaba que de otras partes se proveyese; porque á los nuevamente venidos á su servicio no les paresciese, desde luego, pesado su mando y conocimiento, y el conocelle y aborrecelle fuese en un tiempo [...]\n\nFragmento 2: En todo lo sabian proveer tan acertadamente, que cuando entraba por amistad alguno de los Incas en provincias de estas, en breve tiempo quedaba tal, que parescia otra, y los naturales, le daban la obidiencia, consintiendo que sus delegados quedasen en ellas, y lo mismo los mitimaes [...] En otras muchas que entraron de guerra y por fuerza de armas, mandábase que en los mantenimientos y casas de los enemigos se hiciese poco daño, diciéndoles el Señor: \"presto serán estos nuestros como los que ya lo son.\" Como esto tenian conocido, procuraban que la guerra fuese la más liviana que ser pudiese, no embargante que en muchos lugares se dieron grandes batallas, porque todavía los naturales dellos querian conservarse en la libertad antigua, sin perder sus costumbres y religion por tomar otras extrañas; más durando la guerra, siempre habian los Incas lo mejor, y vencidos, no los destruyan de nuevo, antes mandaban restituir los presos, si algunos habia, y el despojo y ponerlos en posesion de sus haciendas y señorío, amonestándoles que no quieran ser locos en tener contra su persona real competencias ni dejar su amistad, antes quisieran ser sus amigos, como lo son los comarcanos suyos. Y diciendo esto, dábanles algunas mujeres hermosas.\n\nFragmento 3: [en tiempo de los gobernantes incas] Si alguno de los indios que trabajaban en las minas enfermaba, se le permitía regresar a casa de inmediato y otro venía a ocupar su lugar; pero nadie era asignado a las minas a menos que estuviera casado para que sus esposas pudieran cuidar de su comida y bebida y, aparte de esto, se aseguraba de que recibieran abundante comida. Con esta forma de hacer las cosas, ninguno lo consideraba un trabajo duro, aunque pasaran toda su vida en las minas, y ninguno murió por exceso de trabajo. Además, se les permitía dejar de trabajar varios días al mes para sus banquetes y recreo.[…]\n[en tiempo de los gobernantes incas] Si en ciertas regiones no había metales que extraer, para que todos contribuyeran con su parte, se pone tributo de pequeñas cosas [...] Otras regiones pagaban tantas miles de cargas de maíz como casas había en ellas [...] Y toda la comida y artículos necesarios para hacer la guerra que se aportaban se gastaban en los soldados o en las guarniciones regulares establecidas en diferentes partes del reino para su defensa. Cuando no había guerra, la mayor parte era comida y consumida por los pobres.\n£\nR. Alan Covey [Arqueólogo e historiador especializado en el mundo andino prehispánico y el Imperio inca y profesor en la Universidad de Texas en Austin]. Jennifer A. Dalton [Arqueóloga especializada en economía política, producción artesanal y organización social en los Andes prehispánicos].\nCovey, R. A., & Dalton, J. A. (2025). Fragmentos de su obra \"Economies of the Inca World.\" Cambridge University Press. https://doi.org/10.1017/9781009552080\nFragmento 1: [El antropólogo John V. Murra] Consideraba que la economía política inca era una ampliación de grupos de parentesco (ayllus) organizados según principios de reciprocidad (ayni) y autosuficiencia económica. Murra sostenía que los ayllus serranos se asentaban y trabajaban en diversos pisos ecológicos para explotar directamente una amplia gama de recursos, fenómeno que denominó inicialmente \"archipiélago vertical\".\n\nFragmento 2: Las poblaciones rurales que trabajaban directamente para la nobleza inca y para la religión estatal produjeron un excedente de productos básicos sin precedentes, que era conservado en depósitos de almacenamiento construidos a lo largo del Cuzco rural. Parte de esa abundancia sostenía los lujos de la vida palaciega y proporcionaba los alimentos y bebidas servidos en los espectáculos públicos celebrados en Cuzco. […] Los gobernantes incas utilizaban su derecho soberano sobre el trabajo para mejorar tierras agrícolas y construir palacios, y correspondían simbólicamente a ese trabajo proporcionando alimentos y herramientas a los trabajadores y financiando festividades para celebrar la finalización de las obras."

    "titulo": "Naciones originarias del sur: de los valles calchaquíes a la Patagonia",
    "texto": "Ulrico Schmidl (1510-1579)\nFragmentos de \"Viaje al Río de la Plata (1534-1554)\" [aclaración del profesor: en la obra de Ulrico Schmídel, las fechas aparecen con un año de atraso, es decir, cuando Schmidl dice que el año es \"1535\", en realidad el año es \"1536\". Esto se debe a que Schmidl redactó su crónica muchos años después de los hechos y, por eso, no recordaba bien las fechas exactas en que esos hechos sucedieron].\n\nFragmento 1: CAPÍTULO XI: EL SITIO DE BUENOS AIRES\nDespués de esto seguimos un mes todos juntos pasando grandes necesidades en la ciudad de Bonas Ayers hasta que pudieron aprestar los navíos. Por este tiempo los indios con fuerza y gran poder nos atacaron a nosotros y a nuestra ciudad de Bonas Ayers en número hasta de 23.000 hombres; constaban\nde cuatro naciones llamadas, carendies, barenis (guaranís), zechuruas, (charrúas) y zechenais diembus (chanás timbús). La mente de todos ellos era acabar con nosotros; pero Dios, el Todopoderoso, nos favoreció a los más; a él tributemos alabanzas y loas por siempre y por sécula sin fin; porque de los\nnuestros sólo cayeron unos 30 con los capitanes y un alférez. Y eso que llegaron a nuestra ciudad Bonas Ayers y nos atacaron, los unos trataron de tomarla por asalto, y los otros empezaron a tirar con flechas encendidas sobre nuestras casas, cuyos techos eran de paja (menos la de nuestro capitán\ngeneral que tenía techo de teja), y así nos quemaron la ciudad hasta el suelo. Las flechas de ellos son de caña y con fuego en la punta; tienen también cierto palo del que las suelen hacer, y éstas una vez prendidas y arrojadas no dejan nada; con las tales nos incendiaron, porque las casas eran de paja.\nA parte de esto nos quemaron también cuatro grandes navíos que estaban surtos a media milla (legua) de nosotros en el agua. La tripulación que en ellos estaba, y que no tenía cañones, cuando sintieron el tumulto de indios, huyeron de estos 4 navíos a otros 3, que no muy distante de allí estaban y\nartillados. Y al ver que ardían los 4 navíos que incendiaron los indios, se prepararon a tirar y les metieron bala a éstos; y luego que los indios se apercibieron, y oyeron las descargas, se pusieron en precipitada fuga y dejaron a los cristianos muy alegres. Todo esto aconteció el día de San Juan, año de 1535\n\nFragmento 2: CAPÍTULO XVI: PARTEN EN BUSCA DEL PARAGUAY Y LLEGAN A LOS CORONDAS\nDespués de esto, pasado el acuerdo de los capitanes, partimos con los 400 hombres en ocho pequeños navíos (o) parchadines (bergantines) aguas arriba del Paranaw, en busca de otra agua corriente llamada Paraboe (Paraguay), adonde viven los carios que tienen trigo turco (maíz), y una raíz con el\nnombre de manteochade (mandioca) y otras raíces como padades (batatas)  y manteoch propie y mandeoch mandepore. […] Estos carios tienen pescado y carne, y unas ovejas muy grandes como las mulas de esta tierra (Alemania); ítem más tienen chanchos del monte, avestruces y otras salvajinas; iten más gallinas y gansos en gran abundancia. Así, pues, partimos del puerto Bon Esperainso (Buena Esperanza) con los dichos 8 navíos parckhadienes, y el primer día, a las 4 leguas de camino, llegamos a una nación con el nombre de karendos (corondas). Ellos se mantienen de carne y pescado, son fuertes de 12.000 hombres, todos aptos para la pelea. Esta nación se parece a la anterior, es decir, a los tiembú, usan estrellitas en las narices, y son bien formados de cuerpo; iten las mujeres son horrorosas, viejas y mozas, con las caras arañadas y siempre ensangrentadas; iten visten, como los tiembú, un corto paño de algodón que las cubre del ombligo a las rodillas, como ya se dijo antes. Estos indios tienen gran copia de pieles de nutria; iten muchas cannaon (canoas) o esquifes. Ellos se compartieron con nosotros de su pobreza, como ser, carne, pescado [y pieles]; nosotros les dimos abalorios, rosarios, espejos, peines, cuchillos [y anzuelos]; dos días permanecimos con ellos, y nos dieron dos carios cautivos que eran de ellos: éstos deberían servirnos de baqueanos y ayudarnos con la lengua.\n\nFragmento 3: CAPÍTULO XX: LOS PUEBLOS CARIOS\nDespués de esto tuvimos que dejar a estos Aygass y llegamos a una otra nación, llamada Caríes (Carios), están a 50 millas (leguas) de camino de los Aygas; allí Dios, él que todo lo puede, nos dio su santa bendición, porque estos carios tenían trigo turco o meys (maíz) y manndeochade (mandioca),\npadades (batatas), manndeos perroy, mandeporre, manduris (manduvís), vackgekhue, también pescado y carne, ciervos y chanchos del monte, avestruces, ovejas de la tierra (guanacos), conejillos, gallinas y gansos; también tienen miel, de la que se hace vino, en mucha abundancia, iten hay muchísimo\nalgodón en la tierra. La tierra de estos carios es de mucha extensión, casi 300 millas (leguas) de ancho y largo, son hombres petizos y gruesos y más capaces de servir a otros. Iten los varones tienen\nen el labio un agujero pequeño en el que meten un cristal amarillo, que en lengua de ellos se llama parabol (barbote), de dos jemes de largo y grueso como el canuto de una pluma. Esta gente, hombres y mujeres, andan en cueros vivos, tal como Dios los echó al mundo. Entre estos indios el padre vende a la hija, iten el marido a la mujer, si esta no le gusta, también el hermano vende o permuta a la hermana; una mujer cuesta una camisa, o un cuchillo de cortar pan, o un anzuelo o cualquier\notra baratija por el estilo. Estos carios también comen carne humana, cuando se ofrece, es decir, cuando pelean y toman algún enemigo, sea hombre o mujer, y como se ceban los chanchos en Alemania,\nasí ceban ellos a los prisioneros pero si la mujer es algo linda y joven, la conservan por un año o más, y si durante ese tiempo no alcanza a llenarles el gusto la matan y se la comen, y con ella\nhacen fiesta solemne, o como si fuese para una boda; mas si la persona es vieja la hacen trabajar en la labranza hasta que se muere. Esta gente es la más caminadora de cuantas naciones hay en el Río delle Plata; son grandes guerreros por tierra. Sus pueblos o ciudades están en las alturas del agua (río) Paraboe.\n£\nDiego de Pacheco (1521 - ?)\nFragmento de \"Relación de las Provincias del Tucumán (1569)\"\nRELACION EN SUMA DE LA TIERRA Y POBLAZONES QUE DON GERONIMO LUIS DE CABRERA, GOBERNADOR DE LAS PROVINCIAS DE LOS JURIES, HA DESCUBIERTO, DONDE VA A POBLAR EN NOMBRE DE SU MAGESTAD UNA CIUDAD\nSalidos del Río del Estero, ques el que riega esta provincia Norte Sur, como él va corriendo, casi cuarenta leguas desta ciudad, tierra llana y del temple de los llanos del Pirú, se caminó por el propio rumbo por tierra de serranía que de allí para adelante va, ques las cordilleras que deviden esta tierra de la de Chile, por las cuales se caminó más de otras cincuenta leguas en longitud, y en ellas se hallaron por visita que se hizo, muchos de vista e otros por información, más de seiscientos pueblos de indios que en aquella serranía e valles en medio della hay y están poblados, en los cuales, hecha con diligencia la pesquisa y por las lenguas e cuenta que de cada población se pudo entender, se hallaron haber casi treinta mill indios, gente toda, [o] la más, vestida, dellos con lana y dellos con cueros labrados con pulicía a manera de los guadamecís d'España [...] Las camisetas que traen vestidas son hechas de lana y tejidas primeramente con chaquira a manera de malla menuda de muchas labores en las aberturas y ruedos y bocas-mangas. Crían mucho ganado de la tierra y dánse por ello por las lanas de que se aprovechan. Las poblaciones tienen muy cercanas unas de otras, que por la mayor parte a legua y a media legua y a cuarto y a tiro de arcabuz y a vista una de otra están todas. Son los pueblos chicos, quel mayor terná hasta cuarenta casas y hai muchos de a treinta y a veinte y a quince y a diez y a menos, porque cada pueblo destos no es más que una parcialidad o parentela, y ansí está cada una por sí. Tienen los pueblos puestos en redondo y cercados con cardones y otras arboledas espinosas, que sirven de fuerza, y esto por las guerras que entrellos tienen. Viven en cada casa a\ncuatro y a cinco indios casados y algunos a más. Son las casas por la mayor parte grandes, que en una dellas se halló caber diez hombres con sus caballos armados, que se metieron allí para una emboscada\nque se hizo. Son bajas las casas, e la mitad del altura que tienen está debajo de tierra y entran a ellas como a sótanos, y esto hácenlo por el abrigo para el tiempo frío y por falta de madera que en algunos lugares por allí tienen. Son grandes labradores, que en ningún cabo hay aguas o tierra bañada que no la siembren por gozar de las sementeras de todos tiempos. Es gente que no se embriaga ni se dan\npor esto del beber, como otras naciones de indios, ni se les hallaron vasijas que para esto suelen tener. Es tierra que se hallaron en ella siete ríos caudales y más de setenta o ochenta arroyos e manantiales, todos de muy lindas aguas. Hay grandes pastos e muy buenos asientos para poderse criar ganados en gran número de todos los que en España se crían, y hacer molinos y otras haciendas con que puedan vivir prósperos los que allí vivieren [...] Halláronse grandes muestras y señales de metales\nde oro y plata en muchas partes de la tierra, y por piezas que se vieron entre los indios, sentiende que lo. hay en la tierra y será todo para mucho servicio de Dios Nuestro Señor, y que entrarán los\nnaturales sin mucha premia en su santa ley y será ansimismo para aumento de la Corona y real hacienda de Su Majestad del Rey Nuestro Señor."

    "titulo": "Superación de la crisis feudal y expansión económica europea",
    "texto": "Fragmento de \"El Estatuto de los Trabajadores; 1351\" [promulgado por Eduardo III, rey de Inglaterra entre 1327 y 1377)\nEduardo, por la gracia de Dios, etc., al reverendo padre en Cristo Guillermo, por la misma gracia arzobispo de Canterbury, Primado de toda Inglaterra, saludos. Debido a que gran parte del pueblo y especialmente de los obreros y sirvientes ha muerto ahora en esa peste, algunos, viendo las dificultades de los amos y la escasez de sirvientes, no están dispuestos a servir a menos que reciban salarios excesivos, y otros, en lugar de ganarse la vida mediante el trabajo, prefieren mendigar en la ociosidad: Nosotros, considerando los graves inconvenientes que podrán resultar de la falta especialmente de labradores y tales obreros, hemos celebrado deliberaciones y tratados al respecto con los prelados y nobles y otros hombres sabios sentados a nuestro lado; Por cuyo consejo consensuado hemos considerado oportuno ordenar: que todo hombre y mujer de nuestro reino de Inglaterra, de cualquier condición, sea esclavo o libre, que esté en buen estado físico y sea menor de sesenta años, que no viva del comercio ni ejerza un oficio fijo, ni tenga sus propios medios de subsistencia, ni tierras propias con respecto al cultivo que podría dedicarse a ello, y que no esté sirviendo a otro, si, considerando su posición, se le solicita que preste un servicio adecuado, estará obligado a servir a quien haya considerado oportuno solicitarlo; y solo recibirá los salarios, libreas, meed o sueldo que, en los lugares donde se le solicitó servir, se acostumbraba pagar en el vigésimo año de nuestro reinado de Inglaterra, o en los cinco o seis años comunes inmediatamente anteriores. Siempre que, al retener así su servicio, los señores tengan preferencia sobre otros de sus esclavos o sus arrendatarios de tierras: de manera que, no obstante, dichos señores retengan así a tantos como sean necesarios y no más; y si algún hombre o mujer, siendo así requerido para el servicio, no lo hace, siendo probado el hecho por dos hombres fieles ante los alguaciles o los comisarios de nuestro señor el rey, o los condestables de la ciudad donde esto ocurra, inmediatamente a través de ellos, o de alguno de ellos, será arrestado y enviado a la cárcel más cercana, y allí permanecerá bajo estricta custodia hasta que encuentre fiador para servir en la forma antes mencionada.\n£\nCarlo Cipolla (1922-2000) [Historiador económico italiano que investigó en profundidad la sociedad y economía de la Europa preindustrial, trabajando como docente en diversas universidades prestigiosas de Europa y los EE.UU.]\nFragmentos de su obra \"Historia económica de la Europa Preindustrial\" (edición del año 2003)\nFragmento 1: El hecho fundamental del período 1350-1500 es que las guerras, pero sobre todo la peste y otras enfermedades infecciosas aliviaron a Europa de la presión demográfica que se había ido acumulando desde mediados del siglo XIII. Hablar de una «depresión económica del Renacimiento» sólo porque algunos datos, bastante dudosos, por otra parte, sugieren que en 1450, por poner una fecha, el volumen global de algún comercio o de alguna producción era inferior a los niveles anteriores a 1348, tiene tanto sentido como sostener que Luxemburgo está subdesarrollado respecto a la India porque la renta total de Luxemburgo es más baja que la de la India. Lo que importa no es el producto total, sino el producto per capita. La mortalidad causada por la Peste Negra y por las epidemias sucesivas mantuvo durante más de un siglo la población europea en niveles considerablemente más reducidos que los alcanzados antes de 1347. Entre 1347 y 1500 la población europea descendió posiblemente de 80 millones a 60 o 70 millones.\n\nFragmento 2: Los historiadores han probado que en Inglaterra [para el año 1400], con una población reducida a unos dos tercios de su anterior tamaño, la producción de estaño siguió manteniéndose en los niveles anteriores lo cual, naturalmente, significa que la producción per capita aumentó en cerca del 30 por 100. Lo mismo puede decirse de las exportaciones inglesas de lanas y tejidos de lana. En torno a 1400 la producción total europea de hierro oscilaba alrededor de las 25.000-30.000 toneladas. A finales del siglo, la producción de hierro había aumentado probablemente a unas 40.000 toneladas. Las tierras marginales, ocupadas en tiempos de presión demográfica, fueron abandonadas cuando la población disminuyó (véase sobre todo el caso de las Wüstungen alemanas). El resultado fue un aumento de la producción del trabajo agrícola y una redistribución de la renta.\n\nFragmento 3: Entre 1350-1500, los salarios subieron poco a poco, mientras que la renta demostró una tendencia a estancarse o disminuir. [Antes de la peste negra, o sea del año 1348] el factor trabajo era relativamente abundante, mientras que el factor capital era relativamente escaso. Tras la pandemia de peste de 1348 se invirtió la situación. Los trabajadores podían ahora alzar la voz, y lo hacían en términos muy poco edulcorados [...] En la nueva situación, los salarios reales aumentaron y las condiciones de vida de la clase trabajadora mejoraron sensiblemente, [en Italia] antes de la peste el infame y mortífero trabajo de remar en las galeras era realizado por trabajadores voluntarios. Después de la peste no se halló a nadie que lo aceptase, y la ocupación de remero se convirtió en tarea de esclavos y presidiarios.\n£\nHenry Kamen (1936-  ) [Historiador británico, miembro desde 1970 de la Royal Historical Society, que ha estudiado en profundidad, y desde diversas perspectivas, la España imperial] \nFragmentos de su libro \"La sociedad europea, 1500-1700\" (1971)\nFragmento 1: Las epidemias. De los grandes agentes de mortandad, el más temido eran las enfermedades\nepidémicas. La peste era la más virulenta, pero puede ser que las acometidas periódicas de otras, como la gripe, el tifus, las fiebres tifoideas y la viruela, ocasionaran más muertes. La gripe, por ejemplo, puede estar detrás de ese informe inglés de 1558 que afirmaba que «a principios de este año perecieron muchos de los hombres más ricos de toda Inglaterra, de una fiebre extraña»; fue una grave crisis durante la cual (de 1557 a 1559) posiblemente falleciera una décima parte de la población inglesa. Las «fiebres» eran un fenómeno habitual, mientras que la peste se identificaba más fácilmente por su impacto brutal. Las tres grandes pestes de Londres así lo demuestran: en 1603 las víctimas de la peste ascendieron al 77 por 100 de todos los fallecimientos, en 1625 al 65 por 100 y en 1665 a cerca de un 70 por 100. La proporción de los que sucumbían a la peste, sobre todo en las ciudades,\nera escalofriante. Es muy posible que una cuarta parte de la población de Londres pereciera en la de 1563, siendo entonces el índice de mortalidad siete veces superior al de años normales.\n\nFragmento 2: El hambre. «Este año», escribía a casa desde Nápoles un corresponsal español en 1606,\n«Dios ha querido afligir a este reino, y a Sicilia y otras partes de Italia, con una cosecha desastrosa, y de la de aquí se dice que ha sido la peor en cuarenta años». La noticia era exagerada, pues sólo diez años antes había habido una escasez todavía más severa; pero era inevitable que cada crisis pareciera peor que la anterior, y los años malos eran lo bastante frecuentes para determinar \nun efecto acumulativo adverso. [...] Las existencias de alimentos se veían afectadas principalmente por el tiempo atmosférico, pero también dependían de factores humanos tales como la buena explotación de la tierra, el volumen de la demanda de la población, la existencia de buenas comunicaciones y medios de transporte y la presencia de la guerra. En una era en la que había países con barreras aduaneras que separaban incluso una provincia de otra, era posible que una de dos regiones contiguas padeciese hambre mientras la otra se nutría adecuadamente. La importancia de la «crisis de subsistencia» para la mortalidad ha sido muy discutida. Algunos estudiosos han argumentado que las crisis de subsistencia podían tener efectos devastadores, y que la población fallecía en gran número\nen situaciones de escasez. Otros han sostenido que muy poca gente se moría de hambre o de mala alimentación en la Europa moderna; y que, aunque posiblemente la desnutrición debilitara la salud, en la mayoría de los casos el verdadero verdugo eran las enfermedades.\n\nFragmento 3: La guerra. Todos los demás azotes se subsumían en el de la guerra. [...] Era inevitable que la guerra por sí misma no causara gran mortandad: los ejércitos fueron relativamente pequeños hasta finales del siglo XVII, la movilización masiva no existía, las armas eran poco eficaces. A pesar de esas limitaciones, no se puede minimizar su impacto: con sus estragos, la soldadesca extendía las epidemias y agravaba el hambre, y a veces cometía atrocidades espeluznantes. Resumiendo, las consecuencias de la gran represión de Cromwell en Irlanda, sir William Petty, que tenía pleno acceso a la documentación oficial, calculaba que «entre el 23 de octubre de 1641 y el mismo día de 1652 han\nperecido unos quinientos cuatro mil irlandeses, asolados por la espada, la peste, el hambre, las penalidades y el destierro». La primera mitad del siglo XVI estuvo relativamente libre de hostilidades\ndentro de la Europa cristiana; sólo Italia las padeció en cierta medida (el saqueo de Roma en 1527 es un ejemplo notorio). En la segunda mitad del siglo la guerra se había hecho universal por tierra y mar, ya se tratará de conflictos civiles y religiosos o de la lucha contra el turco, y los ejércitos empezaron a ser mayores. El de Felipe II en Flandes se elevó a ochenta y cinco mil hombres, y en 1630 Wallenstein mandaba en Alemania a unos cien mil. En 1659 el Estado francés tenía en armas a ciento veinticinco mil hombres, doblándose y triplicándose ese número bajo Luis XIV."

    "texto": "Leonardo Bruni (1370-1444)\nFragmento de \"Laudatio Florentinae Urbis (Elogio de la ciudad de Florencia)\" [escrita entre los años 1403-1404]\nPero vuestro fundador es el pueblo romano, el señor y conquistador del mundo entero. ¡Dios inmortal, cuántos bienes has conferido a esta única ciudad, de modo tal que todo cuanto ocurre, sin importar dónde ni con qué propósito fue ordenado, parece redundar en beneficio de Florencia!\nPorque el hecho de que la raza florentina haya surgido del pueblo romano es de la mayor importancia. ¿Qué nación en el mundo entero fue jamás más distinguida, más poderosa, más destacada en toda clase de excelencia que el pueblo romano? Sus hazañas son tan ilustres que las mayores gestas realizadas por otros hombres parecen un juego de niños en comparación con las de los romanos. Su dominio se extendió al mundo entero y lo gobernaron con la mayor competencia durante muchos siglos, de modo que de una sola ciudad surgieron más ejemplos de virtud de los que todas las demás naciones han podido producir hasta ahora.\nEn Roma hubo hombres innumerables tan sobresalientes en toda clase de virtud que ninguna otra nación sobre la tierra ha sido jamás su igual. Por lo tanto, también a vosotros, hombres de Florencia, os corresponde por derecho hereditario el dominio sobre el mundo entero y la posesión del legado de vuestros padres.\n£\nPoggio Bracciolini (1380-1459)\nFragmentos de \"De Avaritia\" [Tratado sobre la avaricia, 1428-1429]\nPrimer fragmento: \"Pues el dinero es necesario, como los nervios con los que se sostiene la república, y como hay muchos avaros, deben ser juzgados como su base y fundamento.\"\nSegundo fragmento: \"...si cada uno descuida trabajar más allá de lo que excede su propio uso, será necesario que, omitiendo lo demás, todos nosotros cultivemos la tierra.\"\nTercer fragmento: \"Las ciudades, las repúblicas, las provincias, los reinos, ¿qué otra cosa son, si lo consideras correctamente, sino talleres públicos de avaricia?\"\nCuarto fragmento: \"De donde se sigue que no solo es natural, sino que se reconoce que la avaricia es una cosa útil y necesaria.\"\nQuinto fragmento: \"Preferiría, sin embargo, que se hablara contra la avaricia, ya que temo que sea necesario que nos volvamos avaros debido a la escasez de ganancias, con las cuales apenas podemos mantener la dignidad de nuestro oficio\" [Bracciolini fue secretario de la curia, es decir, del papa]\nSexto fragmento: \"...esos hipócritas y parásitos que deambulan de plaza en plaza, que se ganan la vida sin sudor ni trabajo bajo la apariencia de la religión...\"\nSéptimo fragmento: \"Pues todo lo que todos hacen se emprende por causa del dinero... todos los negocios y obras cesarán por completo [si se eliminara el deseo de lucro]\"\nOctavo fragmento: \"Nada es de un ánimo tan estrecho y tan pequeño como amar las riquezas... [pero] si las tienes, empléalas en la beneficencia y la liberalidad\"\nNoveno fragmento: \"Yo, por otro lado, apruebo y aspiro a esa virtud [la de la avaricia] que es confirmada por la vida\"\n£\nNicolás Maquiavelo\nFragmento de \"El Príncipe, 1513\"\nCapítulo XVII: De la crueldad y la clemencia; y si es mejor ser amado que temido, o ser temido que amado. Paso a las otras cualidades ya cimentadas y declaro que todos los príncipes deben desear ser tenidos por clementes y no por crueles. Y, sin embargo, deben cuidarse de emplear mal esta clemencia, César Borgia era considerado cruel, pese a lo cual fue su crueldad la que impuso el orden en la Romaña, la que logró su unión y la que la volvió a la paz y a la fe. Por lo tanto, un príncipe no debe preocuparse porque lo acusen de cruel, siempre y cuando su crueldad tenga por objeto el mantener unidos y fieles a los súbditos; porque con pocos castigos ejemplares será más clemente que aquellos que, por excesiva clemencia, dejan multiplicar los desórdenes, causas de matanzas y saqueos que perjudican a toda una población, mientras que las medidas extremas adoptadas por el príncipe sólo van en contra de uno. Y es sobre todo un príncipe nuevo el que no debe evitar los actos de crueldad, pues toda nueva dominación trae consigo infinidad de peligros. [...] Surge de esto una cuestión: si vale más ser amado que temido, o temido que amado. Nada mejor que ser ambas cosas a la vez; pero puesto que es difícil reunirlas y que siempre ha de faltar una, declaro que es más seguro ser temido que amado.\nPorque de la generalidad de los hombres se puede decir esto: que son ingratos, volubles, simuladores, cobardes ante el peligro y ávidos de lucro. Mientras les haces bien, son completamente tuyos: te ofrecen su sangre, sus bienes, su vida y sus hijos, pues —como antes expliqué— ninguna necesidad tienes de ello; pero cuando la necesidad se presenta se rebelan. Y el príncipe que ha descansado por entero en su palabra va a la ruina al no haber tomado otras providencias [...] Y los hombres tienen menos cuidado en ofender a uno que se haga amar que a uno que se haga temer; porque el amor es un vínculo de gratitud que los hombres, perversos por naturaleza, rompen cada vez que pueden beneficiarse; pero el temor es miedo al castigo que no se pierde nunca. [...] no es imposible ser a la vez temido y no odiado; y para ello bastará que se abstenga de apoderarse de los bienes y de las mujeres de sus ciudadanos y súbditos, y que no proceda contra la vida de alguien sino cuando hay justificación conveniente y motivo manifiesto; pero sobre todo abstenerse de los bienes ajenos, porque los hombres olvidan antes la muerte del padre que la pérdida del patrimonio."

    "texto": "Suzanne Islas Azais [ es doctora en humanidades, con especialidad en filosofía política, por la Universidad Autónoma Metropolitana, Unidad Iztapalapa, de México] Fragmentos de su texto \"Humanismo y Renacimiento\" [disponible en Dialnet-HumanismoYRenacimientoSantidrianPedroRComp-7646028.pdf]\n\nFragmento 1: Con la idea de \"recuperar la historia dándole una interpretación que sirva para el futuro\", Pedro R. Santidrián presenta en [su reciente] compilación textos clásicos de siete humanistas pertenecientes al Renacimiento italiano de los siglos XV y XVI. Los pensadores y temas seleccionados son: Lorenzo Valla (Las elegancias de la lengua latina y Sobre el libre albedrío), Marsilio Ficino (\"Comentario al Simposio o Banquete de Platón\"), Angelo Poliziano (Lamia: la bruja. Introducción a los Priora Analytica de Atistóteles), Giovanni Pico de la Mirandola (Discurso sobre la dignidad del hombre), Pietro Pomponazzi (Sobre la inmortalidad del alma), Baltasar Castiglione (El cortesano) y Francisco Guicciardini (Historia de Italia y Escritos autobiográficos. Relación de España). A pesar de la diversidad de problemas tratados por estos autores, entre los que se encuentran el del libre albedrío, el amor, el alma humana, la filosofía, la dignidad del hombre y la historia, resulta claro que los textos tienen en común la idea del hombre como centro de las cuestiones espirituales, idea ésta que definió a la época renacentista.\n\nFragmento 2: La compilación que comentamos representa así, una adecuada muestra de la disposición intelectual propia del Renacimiento. En la perspectiva de estos humanistas el hombre es, fundamentalmente, una creación divina. No obstante, Dios otorgó también al hombre la libertad para la realización de su propio ser. […] Otro aspecto que cabe destacar del espíritu renacentista es su alta valoración del papel que tiene el pensamiento filosófico en la vida humana. Por otra parte, el Renacimiento constituye una recuperación del pensamiento clásico, sobre todo del griego, pero también una apertura espiritual que ha- ce posible, por ejemplo, que la reflexión de Pico de la Mirandola se sustente en el pensamiento griego, como en la sabiduría oriental, árabe y judía, y busque conciliar a pensadores como Platón, Aristóteles, Escoto, Tomás de Aquino, Averroes y Avicena. Y el Renacimiento hace posible, además, que Leonardo da Vinci sea un hombre universal: \"literato, filósofo, pintor, arquitecto, conjunción de arte y geometría, de justeza y de belleza\".\n£\nErasmo de Rotterdam (1466-1536)\nFragmentos de \"Elogio de la Locura, 1511\".\n\nFragmento 1: «Si en medio de estas gentes surgiese uno de esos sabios odiosos y proclamase, como es verdad: \"No morirás mal si has vivido bien; redimirás los pecados si añades a la ofrenda lágrimas, vigilias, oraciones, ayunos y cambias todo el estilo del vivir; tal santo te protegerá si emulas su vida\". Si tal sabio, repito, se desgañitase con estas y parecidas razones, ¡mira de cuánta felicidad privaría súbitamente a las almas y en qué confusión las pondría!»\n\nFragmento 2: «Pero me parece oír protestar a los filósofos: \"Eso que tú ensalzas es deplorable; es ser dominado por la necedad y en virtud de ella errar, ignorarse, ignorar\". Precisamente —les contesto yo— eso es ser hombre; y no veo por qué lo llamáis deplorable, cuando así también habéis nacido vosotros, así os habéis criado, así os habéis educado, y ésa es la suerte común a todos los mortales. No es posible decir que sea deplorable aquello que se deriva de la propia naturaleza del ser»\n\nFragmento 3: «¿Hay algo que sea más necio que la complacencia y la admiración de sí mismo? Y, sin embargo, si estáis descontentos de vosotros, ¿qué es lo que podríais hacer con gentileza, con gracia y con dignidad? Quitad este estímulo del amor propio, y al punto el orador no conseguirá emocionar a nadie con sus cadencias; el actor, con todo su dominio escénico, no recogerá más que silbidos; el poeta y sus Musas serán objetos de irrisión, y el pintor y su arte, desdeñados... ¡Tan necesario es que cada cual se lisonjee a sí mismo y se procure su estimación antes de buscar el aprecio de los demás!»\n\nFragmento 4: «Creen los reyes realizar cumplidamente su misión cazando a menudo, sosteniendo hermosos caballos, vendiendo en beneficio propio los cargos públicos, buscando diariamente nuevos pretextos para aligerar el bolsillo de los súbditos y rellenar los suyos... Se imaginan que cumplen intachablemente el deber real con cazar constantemente... y aplicarse a encontrar medios nuevos de apoderarse del dinero de los vasallos y llevarlo a su tesoro. Así, para cubrir con la máscara de la justicia sus iniquidades, resucitan viejos títulos y de cuando en cuando añaden algún halago al pueblo para tenerlo en su favor»"

n ser preferidas a las demás buenas obras de caridad.\n42. Debe enseñarse a los cristianos que no es la intención del Papa, en manera alguna, que la compra de indulgencias se compare con las obras de misericordia.\n43. Hay que instruir a los cristianos que aquel que socorre al pobre o ayuda al indigente, realiza una obra mayor que si comprase indulgencias.\n[...]\n66. Los tesoros de las indulgencias son redes con las cuales ahora se pescan las riquezas de los hombres.\n67. Respecto a las indulgencias que los predicadores pregonan con gracias máximas, se entiende que efectivamente lo son en cuanto proporcionan ganancias.\n[...]\n69. Los obispos y curas están obligados a admitir con toda reverencia a los comisarios de las indulgencias apostólicas.\n[...]\n75. Es un disparate pensar que las indulgencias del Papa sean tan eficaces como para que puedan absolver, para hablar de algo imposible, a un hombre que haya violado a la madre de Dios.\n76. Decimos, por el contrario, que las indulgencias papales no pueden borrar el más leve de los pecados veniales, en concierne a la culpa.\n77. Afirmar que si San Pedro fuese Papa hoy, no podría conceder mayores gracias, constituye una blasfemia contra San Pedro y el Papa.\n[...]\n80. Tendrán que rendir cuenta los obispos, curas y teólogos, al permitir que charlas tales [aquellas que acompañan la venta de indulgencias] se propongan al pueblo.\n[...]\n82. Por ejemplo: ¿Por qué el Papa no vacía el purgatorio a causa de la santísima caridad y la muy apremiante necesidad de las almas, lo cual sería la más justa de todas las razones si él redime un número infinito de almas a causa del muy miserable dinero para la construcción de la basílica, lo cual es un motivo completamente insignificante?\n£\nMartín Lutero (1483-1546)\nFragmento de \"Carta a la nobleza cristiana de la nación alemana (1520)\"\nEmpezaremos por atacar la primera muralla. Se ha establecido que el Papa, los obispos, los sacerdotes y los monjes sean llamados el estado eclesiástico; y los príncipes, los señores, los artesanos y los agricultores, el estado secular. Es una mentira sutil y un engaño. Que nadie se asuste y esto por la consiguiente causa: todos los cristianos son en verdad de estado eclesiástico y entre ellos no hay distingo, sino sólo a causa del ministerio, como Pablo dice que todos somos un cuerpo, pero que cada miembro tiene su función propia con la cual sirve a los restantes. Esto resulta del hecho de que tenemos un solo bautismo, un Evangelio, una fe y somos cristianos iguales, puesto que el bautismo, el Evangelio y la fe de por sí solas hacen eclesiástico y pueblo cristiano. El hecho de que el Papa o el obispo unja, tonsure, ordene, consagre y vista de otro modo que los laicos, puede hacer un hipócrita y falso sacerdote, pero jamás hace a un cristiano o a un hombre espiritual. Según ello, por el bautismo todos somos ordenados sacerdotes, como San Pedro dice: \"Vosotros sois un sacerdocio real y un\nreino sacerdotal\". Y en el Apocalipsis 20: \"Y por tu sangre nos has hecho sacerdotes y reyes\". Si en nosotros no hubiera una ordenación más alta que la que da el Papa u obispo, por la ordenación\ndel Papa y obispo jamás se haría un sacerdote, tampoco podría celebrar misa, predicar y absolver. [...] Y lo diré en forma aún más clara: si un número de buenos laicos cristianos fueran hechos\nprisioneros y llevados a un desierto, sin que hubiese entre ellos un sacerdote ordenado por un\nobispo, y poniéndose de acuerdo eligiesen a uno de ellos —esté casado o no— y le\nencomendasen el ministerio de bautizar, de celebrar misa, de absolver y de predicar, éste sería\nverdaderamente sacerdote, como si todos los papas y obispos lo hubieran ordenado. Por esto, en\ncaso de necesidad cualquiera puede bautizar y absolver, lo cual no sería posible si no fuésemos\ntodos sacerdotes. Esta gran gracia y poder del bautismo y del estado cristiano, fueron aniquilados\ny anulados completamente por medio del derecho canónico.\n£\nCarlos V de Alemania y I de España (1500-1558)\nFragmentos de la \"Declaración de Carlos V en la dieta de Wörms (19 de abril de 1521)\"\nVosotros sabéis que Yo desciendo de los emperadores cristianísimos de la noble nación de Alemania,\ny de los reyes católicos de España, y de los archiduques de Austria y duques de Borgoña; los cuales\nfueron hasta la muerte hijos fieles de la Santa Iglesia Romana, y han sido todos ellos defensores de la Fe católica y sacros cánones, decretos y ordenamientos y loables costumbres, para la honra de Dios y aumento de la Fe católica y salud de las almas. Después de la muerte, por derecho natural y hereditario, nos han dejado las dichas santas observancias católicas, para vivir y morir en ellas a su ejemplo. [...] Ya oísteis la respuesta pertinaz que Lutero dio ayer en presencia de todos\nvosotros. Yo os digo, que me arrepiento de haber tanto dilatado de proceder contra el dicho Lutero y su falsa doctrina. Estoy deliberado de no le oír hablar más, y entiendo juntamente dar forma en mandar que sea tomado, guardando el tenor de su salvoconducto, sin le preguntar ni amonestar más de su malvada doctrina, y sin procurar que algún mandamiento se haga de como suso es dicho; e soy deliberado de me conducir y procurar contra él como contra notorio herege. Y requiero que vosotros os declareis en este hecho como buenos cristianos, y que sois tenidos de lo hacer como lo habeis prometido.\n£\nPhilipp Melanchthon (1497-1560)\nFragmentos de \"Confesión de Augsburgo, (1530)\"\nArtículo IV de la Justificación: También enseñan que los hombres no pueden ser justificados ante Dios por sus propias fuerzas, méritos u obras, sino que son justificados gratuitamente por medio de Cristo, mediante la fe, cuando creen que son recibidos en gracia y que sus pecados son perdonados por Cristo, quien, con su muerte, satisfizo nuestros pecados. Esta fe es la que Dios imputa por justicia ante sus ojos. Romanos 3 y 4.\nArtículo V del Ministerio: Para que podamos alcanzar esta fe, se instituyó el ministerio de la enseñanza del Evangelio y la administración de los sacramentos. Porque por medio de la Palabra y los sacramentos, como por medio de instrumentos, se da el Espíritu Santo, que obra la fe; donde y cuando le place a Dios, en aquellos que oyen el Evangelio; es decir, que Dios, no por nuestros propios méritos, sino por amor de Cristo, justifica a los que creen que son recibidos en la gracia por amor de Cristo. Condenan a los anabaptistas y a otros que piensan que el Espíritu Santo viene a los hombres sin la Palabra externa, a través de sus propias preparaciones y obras.\nArtículo VII de la Iglesia: También enseñan que una sola Iglesia santa perdurará para siempre. La Iglesia es la congregación de los santos, en la que se enseña correctamente el Evangelio y se administran debidamente los Sacramentos. Para la verdadera unidad de la Iglesia basta con estar de acuerdo en la doctrina del Evangelio y en la administración de los Sacramentos. Tampoco es necesario que las tradiciones humanas, es decir, los ritos o ceremonias instituidos por los hombres, sean iguales en todas partes. Como dice Pablo: «Una sola fe, un solo bautismo, un solo Dios y Padre de todos», Efesios 4, 5, 6.\n£\nTomás Moro (1478-1535)\nFragmentos sobre \"Diálogo sobre las herejías (1529)\"\nLibro I, Capítulo 2\nY no conviene tener la necia opinión que tiene Lutero, quien desea, en uno de sus sermones, tener en sus manos todos los fragmentos de la Santa Cruz — y afirma que, si así los tuviera, los arrojaría donde jamás brillara el sol sobre ellos. ¿Y con qué piadosa razón haría el miserable semejante afrenta a la Cruz de Cristo? Porque — según él mismo dice — hay tanto oro empleado en adornar los fragmentos de la Cruz que no queda nada para los pobres.[...] ¡Qué pequeña porción sería, pensamos, el oro en torno a todos los fragmentos de la Cruz de Cristo, comparado con el oro del todo desperdiciado en el dorado de cuchillos, espadas, espuelas, tapices y telas pintadas — y, como si estas cosas no pudieran consumir oro con suficiente rapidez, en el dorado de postes y techos enteros, no solo en los palacios de príncipes y grandes prelados, sino también en las casas de hombres del más común estado!\nY sin embargo, entre todas estas cosas, Lutero no pudo espiar ningún oro que brillara dolorosamente ante sus ojos llorosos — sino únicamente el que rodeaba la Cruz de Cristo.\nPues ese oro, si de allí se quitara, el sabio supone que iría directamente a los pobres. Y esto a pesar de que todos los días ve que quienes tienen la bolsa llena de oro no dan a los pobres ni una pieza de ella; y si dan algo, escarban hasta el fondo entre todo el oro para encontrar un medio penique, o en su país un centavo de cobre — del cual cuatro hacen un cuarto de penique.\n¡Qué nobles causas encuentran los que fingen santidad como pretexto para sus herejías encubiertas!"
