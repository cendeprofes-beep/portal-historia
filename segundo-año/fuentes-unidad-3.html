<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fuentes de la Unidad 3 – Segundo Año</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #002060; }
  :root {
    --bar: 76px; --foot: 28px;
    --pad: clamp(12px, 3vmin, 32px);
    --gap: clamp(12px, 2.2vmin, 28px);
    --cols: 3; --rows: 2;
    --s: min(
      calc((100vw - 2 * var(--pad) - (var(--cols) - 1) * var(--gap)) / var(--cols)),
      calc((100vh - var(--bar) - var(--foot) - 2 * var(--pad) - (var(--rows) - 1) * var(--gap)) / var(--rows))
    );
  }
  @media (orientation: portrait) { :root { --cols: 2; --rows: 3 } }
  .pantalla { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: var(--pad); padding-top: calc(var(--bar) + var(--pad)); padding-bottom: calc(var(--pad) + var(--foot)); }
  .grilla { display: grid; grid-template-columns: repeat(var(--cols), var(--s)); grid-template-rows: repeat(var(--rows), var(--s)); gap: var(--gap); }
  .cuadro {
    width: var(--s); height: var(--s); display: flex; align-items: center; justify-content: center;
    text-align: center; padding: 8%; text-decoration: none; cursor: pointer;
    background: #a9d6f5; color: #111; border: 3px solid rgba(255,255,255,.9); border-radius: 14px;
    font-family: Georgia, "Times New Roman", serif; font-weight: 800; line-height: 1.15;
    font-size: calc(var(--s) * 0.15); box-shadow: 0 4px 14px rgba(0,0,0,.35);
    transition: background .2s ease, transform .2s ease;
  }
  .cuadro:hover, .cuadro:focus-visible { background: #bfe3fa; transform: scale(1.03); outline: none; }
  .pie { position: fixed; left: 0; right: 0; bottom: max(4px, env(safe-area-inset-bottom)); z-index: 9; padding: 0 12px; text-align: center; color: #fff; font-family: Georgia, "Times New Roman", serif; font-weight: 700; font-size: clamp(0.65rem, 1.1vw, 0.85rem); line-height: 1.25; pointer-events: none; }
  .nav {
    position: fixed; top: max(12px, env(safe-area-inset-top)); z-index: 10;
    width: 56px; height: 56px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: #001540; border: 2px solid rgba(255,255,255,.85);
    transition: background .2s ease, transform .2s ease;
  }
  .nav:hover, .nav:focus-visible { background: #0a2f7a; transform: scale(1.08); outline: none; }
  .nav svg { width: 30px; height: 30px; stroke: #fff; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  .nav-izq { left: max(12px, env(safe-area-inset-left)); }
  .nav-der { right: max(12px, env(safe-area-inset-right)); }
  .leyenda-anio {
    position: fixed; top: max(12px, env(safe-area-inset-top)); left: 84px; right: 84px; height: 56px; z-index: 9;
    display: flex; align-items: center; justify-content: center; text-align: center;
    color: #fff; font-family: Georgia, "Times New Roman", serif; font-weight: 700;
    font-size: clamp(1.1rem, 3vw, 2rem); letter-spacing: .06em; line-height: 1.1; pointer-events: none;
  }
</style>
</head>

    <a class="cuadro" target="_blank" rel="noopener" href="APP%20-%20UNIDAD%203/APP%202%20-%20Fuentes.pdf" aria-label="Fuentes del APP 2">Fuentes del APP 2</a>
